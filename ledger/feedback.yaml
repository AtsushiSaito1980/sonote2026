# 人間の感想と、そこから抜き出した「選定の目」
#
# 目的：制作したあとに人間が言った「この回のここが良い／良くない」を、次のネタ選びに効かせる。
#       感想はチャットの中で流れて消えやすく、作業環境も毎回作り直されるので、
#       ここに残さないと次の巡回に届かない。
#
# 使い方：
#   - 人間が制作後に感想を言ったら、entries に1件足す。**言葉はそのまま said に残す**
#     （要約すると、何が刺さったのかの手触りが消える）
#   - 感想から「選定の目」を抜き出し、lenses に足す（既にある目なら from に回を足す）
#   - /patrol は採点の前にこのファイルを読み、候補ごとに当たる目と根拠を書き添える
#     （.claude/commands/patrol.md の 0.7・3・6）
#
# 守ること：
#   - **点数には足さない。**selection.yaml の核・面白さと、score.py の6つの点数は番組の基準。
#     感想の目は「人間が良いと言った回の共通点」で、基準とは別に持つ
#   - **寄せすぎない。**目に当たらないことを、候補を外す理由にしない。核とばらつきが先。
#     同じ目ばかりの回が続くと、回の形が似てくる
#   - **2回以上の感想で挙がった目は、selection.yaml の基準に組み込むかを人間に提案する。**
#     1回の感想だけで基準は変えない
#   - 感想が出典で裏づけられるかを確かめ、結果を entries の note に書く
#     （裏づけの無い印象のまま目にすると、次の巡回で外れた候補を推すことになる）
#
# 欄：
#   lenses  … 選定の目。kind は like（推す目）／avoid（避ける目）
#             test＝候補に当たるかの判定条件／seen_in＝その目が立った回の具体
#             search＝巡回で探すときの切り口／from＝その目が挙がった感想の回
#   entries … 感想の記録。verdict は 良い／普通／良くない

lenses:
  - id: L1
    kind: like
    label: 高い方から入っている
    test: 最初の客・最初の値段が既存品より高い。差額を払う理由を持つ客から売り始め、下の価格帯へ広げている（広げる道筋が見えている）
    seen_in: "ep045：1パック約50ドルのイチゴから入り、7.99ドル・4.99ドルの価格帯を足した。上には6粒50ドルの限定品を残している"
    search: [高価格帯から参入, プレミアム版を先行発売, 段階的に値下げ, 上位モデルから発売, 業務用から一般向けへ]
    from: [ep045]

  - id: L2
    kind: like
    label: 難しいところから入っている
    test: 業界がいちばん難しいとして避けてきた対象を、最初に選んでいる。解ければほかにも広がる順番になっている
    seen_in: "ep045：受粉が要り、屋内では無理とされたイチゴを選んだ。解ければトマトやメロンにも広がる"
    search: [業界で不可能とされた, 世界初の量産, 最も難しい, 誰も手を付けなかった]
    from: [ep045]

  - id: L3
    kind: like
    label: 本人が現物で需要を確かめた場面がある
    test: 計画や調査ではなく、本人が自分の手で現物を客に当てて確かめた具体的な場面が、本人の言葉で残っている
    seen_in: "ep045：日本のイチゴをバッグいっぱい空輸し、アポなしで高級レストランに持ち込んで、シェフに食べさせた"
    search: [最初のお客さん, 飛び込みで持ち込んだ, 試作品を持って回った, 自分で売りに行った]
    from: [ep045]

  - id: L4
    kind: like
    label: 絞り込みが本人の一言で言える
    test: 一点に絞った（ほかを捨てた）ことが、本人の短い言葉で引ける。動機があるだけでなく、選んだことを示す言葉があるか
    seen_in: "ep045：『最初からイチゴしか眼中になかった』"
    search: [それしか考えていなかった, ほかはやらないと決めた, 一本に絞った]
    from: [ep045]

  - id: L5
    kind: like
    label: 既存市場と補い合う
    test: 既存の担い手から奪うのではなく、足りない時期・場所・層を埋める位置にいる
    seen_in: "ep045：日本では夏にほとんど出回らないイチゴを補う。国産のシェアを奪うのではない、という位置づけ"
    why: "聞き手は大企業・中堅の新規事業担当。既存事業や取引先とぶつからない筋は、社内で通す話として持ち帰りやすい（こちらの読み）"
    caution: "補完の位置づけが誰の言葉かを確かめる。ep045 では会社ではなく記者の地の文（マイナビ農業）だった"
    search: [端境期, 空白の時間帯, 既存と共存, 足りない時期を補う]
    from: [ep045]

  - id: L6
    kind: like
    label: 作り方そのものが強みになる
    test: 作り方やこだわりで品質が変わる商品で、作り方を確立すること自体が品質の再現性になり、難しいぶん真似されにくい
    seen_in: "ep045：ふつうのイチゴは作る人や時期で味が変わる。調整できる要素20〜30×生育段階5〜6＝数百万通りを詰め、一年中同じ品質を出す。受粉の詳細は非公開"
    caution: "難しさは時間がたつと薄まる。データ・専用の品種・ブランドなど、難しさで稼いだ時間を別の強みに変えているかも見る（ep045 の時点で、Driscoll's が出資する Plenty も屋内のイチゴに取り組んでいた）"
    search: [製法を確立, 再現性, 職人技を工程に, 品質のばらつきをなくす]
    from: [ep045]

entries:
  - ep: ep045
    on: 2026-10-25
    verdict: 良い
    said: |
      このエピソードはよいですね。高い方から始める、難しいところから始める、苺を空輸してシェフに食べさせた、イチゴしか眼中になかった、みたいなところが良いです。いちごの既存市場との補完関係であるところも良いです。特に、いちごは作り方やこだわりで味が違いそうなので、工場での作り方を確立できたら、かなり良さそうだし、難しいからこそ、他者追従も難しそう。
    lenses: [L1, L2, L3, L4, L5, L6]
    note: "L1〜L5 は回の中で扱った要素。L6 は回の中では扱っていない人間の読みで、出典で確かめた：
      マイナビ農業（2026-08-06）の記者の地の文に『同じ品種でも生産者や時期で味が変わるが、環境の精密な制御で年間を通じ同じ品質を出せる。これが決定的な差別化』とあり、
      本人も調整できる要素20〜30×生育段階5〜6＝数百万通りと話している（AgFunderNews 2021-03-31）。受粉の詳細は非公開。
      一方、2021年時点で Driscoll's が出資する Plenty も屋内のイチゴに取り組んでいた（同記事）"

# 選ぶときに人間が出した指示（selection.yaml と brief の note から拾ったもの）。
# 制作後の感想ではないが、好みの向きとして並べておく
past_signals:
  - {ep: ep028, said: "面白さ95以上", where: ledger/selection.yaml}
  - {ep: ep043, said: "動機の立つ回を優先して選んだ", where: episodes/ep043/brief.yaml}
  - {ep: ep044, said: "もっと振り切ったものを", where: ledger/selection.yaml}
  - {ep: ep045, said: "核が両方立つ Oishii Farm を、T2に立つ menu 終了より選んだ。制作に入る前に、ウェブ検索で情報が集まるかを検証させた", where: ledger/selection.yaml}
