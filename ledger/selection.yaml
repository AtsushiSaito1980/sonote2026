# ネタの採点表
#
# 目的：ep011 で、手も動機も風も無いネタが「型の変化球が足りない」という
#       編成上の都合だけで通ってしまった。面白さの基準が文章の中にあるだけで、
#       候補を出すときに一度も採点されていなかったのが原因。
#
# 使い方：
#   - /patrol が候補を出すとき、1件ずつこの表で採点する
#   - 人間が1本選んだら、選んだ回を entries に1行足す
#   - 見送った候補は backlog.yaml の reason に点数を書く（「面白さ2/5・核なし」）
#
# 判定：
#   - 核（Q1/Q2）が両方 ✗ → **不採用**。点数を見るまでもない
#   - 面白さ（C1〜C5）が ○ 3つ未満 → 原則不採用
#   - ばらつき（scripts/spread.py）で ✗ が出たら、理由を書けるときだけ通す
#
# 記号：○ = 満たす／△ = 半分／✗ = 満たさない
#
# ---------------------------------------------------------------------------
# 3つの点数（scripts/score.py が計算・docs/selection.html に出る）
#
#   ① 面白さ   Q1 Q2 C1 C2 C5              … 聞きたくなるか
#   ② 応用     C3 C4 ＋ 手OP・動機MO・風TW  … 持ち帰って使えるか
#   ③ ばらつき 手・動機・風・型・畑・主役・技術度の7軸 … 前と違う回になるか
#
# **3つは足さない。**足すと、何が良くて何が悪いのかが消える。低いものを見る。
# ② に OP・MO・TW を入れているのは、この企画の芯が
# 「手と動機と風の組み合わせで、新規事業に移せる形に抽象化すること」だから。
# タグが立たない回は、そこで点が落ちる（ep011 が 30 なのはこれ）。
# ③ は**その回を選んだ時点**（それより前の回だけ）で計算する。
#
# 続けながら直すために、公開後に2つ書き足す（任意）：
#   likes: 42    … note のいいね数
#   gut:   ○     … 自分の手応え（○△✗）
# 点数と、いいねと、手応えがずれていたら、**直すのは基準のほう。**

core:                       # 番組の核。どちらか一方は必ず ○ であること
  - id: Q1
    label: 表の問い
    ask: なんで、それで儲かるんですか？
    test: 儲けている主体（会社・店・事業）が登場するか
  - id: Q2
    label: 裏の問い
    ask: なんで、その人がやったんですか？
    test: 動機を持った人が主役に立つか

interest:                   # 面白さ。5つのうち ○ 3つ以上で採用（docs/plan.md 3-5）
  - id: C1
    label: 主役が意外
    test: 「その業種がそれを？」がある。毎月ニュースになる定番題材は ✗
  - id: C2
    label: 立つ数字がひとつ
    test: それ一つで景色が変わる数字か。月次で更新される流量の数字は △
  - id: C3
    label: 構造が転用できる
    test: 聞き手が自分の業界に置き換えられる。読み方の話は △（手の地図が増えない）
  - id: C4
    label: 教訓が一行になる
    test: 条件＋行動の1文に落ちるか
  - id: C5
    label: 耳だけで絵が浮かぶ
    test: 図解なしで場面が見えるか。割合の列挙は ✗

premise:                    # 前提。ひとつでも欠ければ、点数以前に見送る
  - id: P1
    label: トリガが1ヶ月以内
  - id: P2
    label: 出典が一次、または2系統
  - id: P3
    label: 題材が過去回と重複しない

# 軸ごとのばらつきは scripts/spread.py が episodes_log.csv から計算する。
# ここには書かない（二重管理になるため）。

