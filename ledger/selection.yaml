# ネタの採点表
#
# 目的：ep011 で、手も動機も風も無いネタが「型の変化球が足りない」という
#       編成上の都合だけで通ってしまった。面白さの基準が文章の中にあるだけで、
#       候補を出すときに一度も採点されていなかったのが原因。
#
# 使い方：
#   - /patrol が候補を出すとき、1件ずつこの表で採点する
#   - 人間が1本選んだら、選んだ回を entries に1行足す
#   - 見送った候補は backlog.yaml の reason に点数を書く（「面白さ2/5・核なし」）
#
# 判定：
#   - 核（Q1/Q2）が両方 ✗ → **不採用**。点数を見るまでもない
#   - 面白さ（C1〜C5）が ○ 3つ未満 → 原則不採用
#   - ばらつき（scripts/spread.py）で ✗ が出たら、理由を書けるときだけ通す
#
# 記号：○ = 満たす／△ = 半分／✗ = 満たさない

core:                       # 番組の核。どちらか一方は必ず ○ であること
  - id: Q1
    label: 表の問い
    ask: なんで、それで儲かるんですか？
    test: 儲けている主体（会社・店・事業）が登場するか
  - id: Q2
    label: 裏の問い
    ask: なんで、その人がやったんですか？
    test: 動機を持った人が主役に立つか

interest:                   # 面白さ。5つのうち ○ 3つ以上で採用（docs/plan.md 3-5）
  - id: C1
    label: 主役が意外
    test: 「その業種がそれを？」がある。毎月ニュースになる定番題材は ✗
  - id: C2
    label: 立つ数字がひとつ
    test: それ一つで景色が変わる数字か。月次で更新される流量の数字は △
  - id: C3
    label: 構造が転用できる
    test: 聞き手が自分の業界に置き換えられる。読み方の話は △（手の地図が増えない）
  - id: C4
    label: 教訓が一行になる
    test: 条件＋行動の1文に落ちるか
  - id: C5
    label: 耳だけで絵が浮かぶ
    test: 図解なしで場面が見えるか。割合の列挙は ✗

premise:                    # 前提。ひとつでも欠ければ、点数以前に見送る
  - id: P1
    label: トリガが1ヶ月以内
  - id: P2
    label: 出典が一次、または2系統
  - id: P3
    label: 題材が過去回と重複しない

# 軸ごとのばらつきは scripts/spread.py が episodes_log.csv から計算する。
# ここには書かない（二重管理になるため）。

entries:
  - {ep: ep001, Q1: ○, Q2: ✗, C1: ○, C2: △, C3: ○, C4: ○, C5: ○, note: "業界の物差しを反転させた3商品。小ネタ束ねの形で、数字は個々に散った"}
  - {ep: ep002, Q1: ○, Q2: ✗, C1: ○, C2: △, C3: ○, C4: ○, C5: ○, note: "施行前にもう売り場が開いていた、が意外の芯。立つ数字より日付が主役"}
  - {ep: ep003, Q1: ○, Q2: ✗, C1: △, C2: ○, C3: ○, C4: ○, C5: ○, note: "「時間をずらす」自体は既知寄り。来店7倍の数字で持たせた"}
  - {ep: ep004, Q1: ○, Q2: ✗, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "無料の花火を誰が払っているか。警備費の割合が効いた"}
  - {ep: ep005, Q1: ○, Q2: ○, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "核が両方立った回。動機回の基準値"}
  - {ep: ep006, Q1: ○, Q2: ✗, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "17年寝かせた技術。最初の効率4%が立つ数字"}
  - {ep: ep007, Q1: ○, Q2: ✗, C1: ○, C2: ○, C3: ○, C4: ○, C5: △, note: "ソフトウェアの話は耳で絵になりにくい。赤字48億で場面を作った"}
  - {ep: ep008, Q1: ○, Q2: ✗, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "戻ってくる倉庫の場面が強い。耐用年数5倍が立つ"}
  - {ep: ep009, Q1: ○, Q2: ✗, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "95.5%が場面ごと立った。売場の画面という絵もある"}
  - {ep: ep010, Q1: ○, Q2: ○, C1: ○, C2: ○, C3: ○, C4: ○, C5: ○, note: "1日1万円と6,644社の対比。核が両方立った2本目"}
  - {ep: ep011, Q1: ✗, Q2: ✗, C1: ✗, C2: △, C3: △, C4: ○, C5: ✗, note: "**この表を作るきっかけになった回。**儲けている主体も、動機を持つ人も出てこない。主役が統計そのもので、見立ても出典自身の見立てと同じだった。型の変化球（T4）が10本ゼロだったことと、棚に「手が立たない」で落ちた候補が残っていたことが重なって通った。作り直さず、基準の見本として残す"}
