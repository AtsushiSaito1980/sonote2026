# ボツネタ棚 — 巡回で挙がったが、その回では選ばなかったネタ
#
# 目的：良いネタを二度と探し直さないこと。
# /patrol は毎回、(1) この棚を先に読んで復活できるものを拾い、
#           (2) 選ばれなかった候補をここへ書き出す。
#
# status は「なぜ見送ったか」であり、そのまま「いつ復活するか」を決める。
#   trigger_wait   トリガ待ち  … 手は立つ。窓内の発表がまだ無い → 発表が出たら復活
#   trigger_stale  鮮度切れ    … トリガはあったが31日窓を外れた → 続報で復活
#   hand_weak      手が立たない … 現象ではあるが商売の手に落ちない → 別の角度が見つかれば復活
#   overlap        直近と被る  … 手・業界が直近5回と重なる → 数回あけたら復活
#   unverifiable   裏取り不能  … 一次資料に到達できない → 資料が公開されたら復活
#   used           別回で消化  … 他の回に組み込んだ（復活しない・記録のみ）
#   dropped        見送り確定  … 復活の見込みなし（記録のみ）
#
# gist は「で、どんな話だったか」を、記号も内部用語も使わない普通の日本語で1〜2文。
# 半年後に棚を眺めたとき、これだけ読めば中身を思い出せることが条件。省略しない。
#
# 書式は facts.yaml と同じフロー記法。1行1件。

entries:
  - {id: bl001, title: 解体材の行き先, gist: "大阪・関西万博の大屋根リング（世界最大級の木造建築）を解体して出た大量の木材が、どこへ引き取られ、何に生まれ変わるのか。イベントの終わりに出る廃材が、値段のつく原料として次の商品へ回っていく話", case_names: 万博大屋根リング木材リユース, industries: 建築;木材;イベント跡地, hand: OP06, motive: MO3想定, tailwind: none, found_on: 2026-08-08, found_in: ep002巡回, status: trigger_wait, reason: "引取先の発表が2026年1月で、以降に窓内の動きが無い", revive_when: "実際の再利用先や加工品の販売開始が発表されたとき。跡地の再開発計画も同系統", sources: "2026-01 引取先発表", note: "OP06拾うの本命候補として温存。ep008でOP06を味として使ったため、主役で使うなら間を空ける"}

  - {id: bl002, title: 排出枠という商品, gist: "2026年度から大企業に義務化される排出量取引で、CO2を出す権利そのものが売り買いできる商品になる。減らせた会社が余った枠を売り、減らせない会社が買う——義務が新しい市場と値段を生む話", case_names: GX-ETS排出量取引2026年度義務化, industries: エネルギー;製造;金融, hand: OP14味, motive: none, tailwind: TW1, found_on: 2026-08-12, found_in: ep009巡回, status: trigger_wait, reason: "制度は決まっているが、窓内に日付イベントが無い", revive_when: "割当の通知・届出期限・取引開始など、日付の立つイベントが発表されたとき", sources: "制度資料", note: "ep002「施行日は開店日」の続編にあたる。同じ手の再演にならないよう、排出枠が商品として売買される側面に寄せる"}

  - {id: bl003, title: 配送設置網を束ねる, gist: "店では競争しているヤマダやエディオンなどの家電量販とメーカーが、配送と設置だけを共同でやる会社を作る構想。冷蔵庫や洗濯機の配達は、時間指定・再訪問・設置工事・古い機械の引き取りが重なる難所で、1社では効率が上がらない", case_names: ヤマダHD;エディオン;家電製販の共同物流, industries: 家電;物流;小売, hand: OP08, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: trigger_stale, reason: "統合合意の発表が2026年6月5日で、31日の窓を外れていた", revive_when: "最終契約・新会社設立・共同物流会社の始動など、次の日付イベントが出たとき", sources: "logi-today 960951／960654；日経（ヤマダHD・パナソニックHDら10社超の共同物流会社構想）", note: "売上高合算で2.5兆円規模。配送設置のラストワンマイルは時間指定・再訪問・工事待ち・旧品回収が重なる難所で、束ねる価値が説明しやすい。ep007でOP08を味として使ったため、主役なら間を空ける"}

  - {id: bl004, title: 消費財サプライチェーンの標準化, gist: "洗剤や食品などを作る・卸す・売る43社が集まり、バラバラだった商品コードや段ボール・パレットの規格を揃えて、一緒に運ぶことを目指す協議会。各社が自社仕様を通してきたぶんのコストが、誰の財布から出ていたのかという話", case_names: 消費財サプライチェーン標準化協議会;製配販43社, industries: 消費財;卸;物流, hand: OP08, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: trigger_stale, reason: "協議会の設立が2026年5月27日で窓外", revive_when: "標準コードの適用開始、共同物流の実運用開始など、協議会の成果が出たとき", sources: "logi-today 956823", note: "商品・事業所コードの標準化、物流資材の標準化、共同物流の実現を掲げる。bl003と同じOP08なので、どちらかを選ぶ形になる"}

  - {id: bl005, title: 8月の値上げ849品目, gist: "2026年8月だけで食品849品目が値上げ。中身を見ると、上がっているのは原材料そのものより、包装・物流・人件費のほう。値上げの理由が「材料が高い」から「運ぶ人・作る人が足りない」へ移りつつある", case_names: 帝国データバンク 食品主要195社 価格改定動向調査, industries: 食品;日用品, hand: none, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: hand_weak, reason: "トリガは窓内で裏取りも容易だが、値上げは現象であって商売の手ではない", revive_when: "個社が値上げ以外の打ち手（容量・販路・課金単位の変更など）で応じた事例が見つかったとき", sources: "帝国データバンク調査（2026年8月・849品目、加工食品469・調味料227・酒類飲料153）；2026-08-13追記：民間まとめでは8月2,311品目・9月4,531品目とされる（TDB一次資料で要再確認）", note: "値上げの内訳が原材料より包装・物流・人件費に寄っている点は使える。ただし単独では回が立たない。9月に大きな山が来るなら、9月中に個社の値上げ以外の打ち手が出やすい"}

  - {id: bl006, title: 障害者雇用率2.7%への引き上げ, gist: "企業が守るべき障害者の法定雇用率が2.7%へ上がった。注目したいのは制度そのものではなく、その受け皿として育っている商売のほう——仕事ごと請け負う特例子会社や、貸農園型のサービスなど、雇用率を満たしたい会社に売る事業が伸びている", case_names: 改正障害者雇用促進法, industries: 人事労務;特例子会社;人材, hand: OP11想定, motive: none, tailwind: TW1, found_on: 2026-08-09, found_in: ep007巡回, status: overlap, reason: "ep002「施行日は開店日」と同じ制度回・TW1で、手も乗るになり重複感が強い", revive_when: "ep002から数回あけたあと。または雇用率対応が生んだ具体的な商売（特例子会社の受託事業など）が見つかったとき", sources: "2026年7月施行", note: "制度そのものではなく、義務化で生まれた受け皿側の商売に寄せれば別の回になる"}

  - {id: bl007, title: 異業種の共同配送, gist: "棚の上では奪い合っているサッポロとキリンが、神奈川で同じトラックにビールを積んで運び始めた。花王と三菱食品の取り組みも同じ形。どこまでを一緒にやり、どこからは競争するのか——その線引きが主題になる", case_names: サッポロ×キリンの共同配送;花王×三菱食品のCODE, industries: 飲料;日用品;物流, hand: OP08, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: trigger_stale, reason: "神奈川エリアでの共同配送開始が2026年6月で窓外", revive_when: "対象エリアの拡大、他社の参加、削減量の実績公表などが出たとき", sources: "logi-today 956420", note: "競合同士が物流だけ組む形。協調領域と競争領域の線引きが主題になりうる"}

  - {id: bl008, title: 交換部品で稼ぎ続ける, gist: "屋外用ベルトコンベヤの部品（ローラ）で国内シェア約52%を握るJRC。7月中旬の四半期開示は経常36%減益だったが、対上期計画の進捗はほぼ5割で計画の線上。据え付けたあとの交換需要＝リペア部品を握っているから業績が読める、という地味な独占の話", case_names: JRC;ベルトコンベヤ部品, industries: 機械部品;鉱山・砕石;物流設備, hand: OP09, motive: none, tailwind: none, found_on: 2026-08-13, found_in: ep010巡回, status: trigger_stale, reason: "動機回のKOMPEITOを優先。トリガ（7/15のQ1開示）は数日で31日窓を出る", revive_when: "10月中旬のQ2開示、月次・大型受注など次の日付イベントが出たとき", sources: "株探 決算速報 k202607150066；会社決算短信（2027年2月期1Q）", note: "OP09は全14手で唯一の未使用。次の日付イベントで最優先で立てる価値がある。シェア約52%・最高益の連続記録は会社資料由来のため裏取り必須"}

  - {id: bl009, title: 海賊版の需要を公式で取りに行く, gist: "集英社が創業100年の8月8日に合わせ、約400作品・100万ページのマンガを100超の言語に翻訳して配信するMANGA MILLIONを8月6日に公開。ONE PIECEは96言語。「小さい言語圏は商売にならない」という当たり前を翻訳コストの変化で崩し、海賊版へ流れていた読者を公式の客に変えにいく話", case_names: 集英社;MANGA MILLION, industries: 出版;コンテンツ配信, hand: OP04, motive: none, tailwind: TW4想定, found_on: 2026-08-13, found_in: ep010巡回, status: overlap, reason: "ep009（メディア・広告）と業界が近接し、2回連続コンテンツ産業になるため見送り", revive_when: "ep009から数回あけたあと。8月中旬開始とされるニアサイマル配信の実績の続報が出れば尚よい", sources: "公式リリース；事業構想オンライン 2026年8月記事", note: "100万ページ・96言語などの数字は公式一次資料で要裏取り。海賊版対策の文脈は感情論に寄せず構造（未充足需要）で扱う"}

  - {id: bl010, title: 借りた営業網で一気に広げる, gist: "営業支援SaaSのナレッジワークが8月4日に35億円を調達し、リコージャパンと資本業務提携。自前の営業では届かない全国の中堅中小へ、複合機で入り込んでいるリコーの販売網に載せて広げ、AI商談記録を2030年度までに3000社へという計画。営業網を貸す側と借りる側、両方から見える提携の話", case_names: ナレッジワーク;リコージャパン, industries: SaaS;営業支援;事務機, hand: OP12, motive: none, tailwind: TW3, found_on: 2026-08-13, found_in: ep010巡回, status: overlap, reason: "OP12はep007の主役、OP02もep005の味と、立てられる手が直近5回と重なる", revive_when: "OP12・OP02が直近5回から抜けたあと、導入社数などの実績イベントが出たとき", sources: "日経 8/4；PR TIMES ナレッジワーク 8/4；マイナビ 8/6（リコージャパン提携・3000社目標）", note: "手の回として立てるならリコー側（営業網の外販）視点が本命。動機は薄い"}

  - {id: bl011, title: 本業が消える前に次を試す, gist: "スパークプラグ大手の日本特殊陶業が、岐阜の自社工場の一角に燃料電池・太陽光・蓄電池を組み合わせた実証施設N-Terraceを新設し、工場のエネルギー管理をまるごと試し始めた。EV化で本業が縮む前に、自分の工場を実験台にして次の商売の種をまく話", case_names: 日本特殊陶業;N-Terrace, industries: 自動車部品;エネルギー;セラミックス, hand: OP06想定, motive: none, tailwind: TW4, found_on: 2026-08-13, found_in: ep010巡回, status: hand_weak, reason: "実証開始は現象で、誰に何を売って儲かるかの構造がまだ見えない", revive_when: "実証したエネルギー管理の外販・商品化など、売り物になる形が発表されたとき", sources: "レスポンス 2026-08-05（実証開始）", note: "本業消失を見越した転換は語り口として強いが、手が立つのは商品化のタイミング"}

  - {id: bl012, title: 毎月の請求に保証を相乗りさせる, gist: "楽天モバイルが8月27日から、スマホの交換保証に家電の補償を組み合わせたサービスを始めるとされる。通信の毎月の請求関係と店舗網を、家電の延長保証という別商品の販路に転用する話", case_names: 楽天モバイル;スマホ交換保証プラス&家電補償, industries: 通信;保険・保証, hand: OP02味, motive: none, tailwind: none, found_on: 2026-08-13, found_in: ep010巡回, status: overlap, reason: "OP02はep005で使用済みのうえ、単発の販路転用で1回を支える厚みが不足。候補段階で一次リリース未確認", revive_when: "提供開始後の実績や他社追随など広がりが出て、OP02が直近5回から抜けたとき", sources: "検索結果の言及のみ（2026-08発表・8/27開始とされる）※公式リリース未確認", note: "使うなら最初に公式リリースを突合する"}

  - {id: bl013, title: 別荘を泊数に分けて売る, gist: "高額の別荘を泊数単位の持ち分に分けて販売し、オーナーが使わない日はホテルとして貸し出すNOT A HOTELが、8月上旬にシリーズDで100億円を調達。買う側は別荘が使う分だけの値段になり、売る側は空いている資産が宿泊業に変わる話", case_names: NOT A HOTEL, industries: 不動産;ホテル;会員権, hand: OP07, motive: none, tailwind: none, found_on: 2026-08-13, found_in: ep010巡回, status: overlap, reason: "OP07「分ける」がep008の主役の手と重複", revive_when: "数回あけたあと、次の調達・海外展開・販売実績などの日付イベントが出たとき", sources: "STARTUP DB Media 資金調達まとめ 8/3-7；日経 スタートアップ資金調達まとめ読み 8/3〜7", note: "所有と利用の分割はep008の家具サブスクと語り口が被る。立てるなら不動産・会員権側の構造に寄せる。持ち分の単位（泊数・分割数）は要裏取り"}

