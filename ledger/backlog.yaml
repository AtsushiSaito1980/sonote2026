  - {id: bl010, title: 借りた営業網で一気に広げる, gist: "営業支援SaaSのナレッジワークが8月4日に35億円を調達し、リコージャパンと資本業務提携。自前の営業では届かない全国の中堅中小へ、複合機で入り込んでいるリコーの販売網に載せて広げ、AI商談記録を2030年度までに3000社へという計画。営業網を貸す側と借りる側、両方から見える提携の話", case_names: ナレッジワーク;リコージャパン, industries: SaaS;営業支援;事務機, field: 産業BtoB, subject: 会社, tech: 中, trigger_on: 2026-08-04, hand: OP12, motive: none, tailwind: TW3, found_on: 2026-08-13, found_in: ep010巡回, status: overlap, reason: "OP12はep007の主役、OP02もep005の味と、立てられる手が直近5回と重なる", revive_when: "OP12・OP02が直近5回から抜けたあと、導入社数などの実績イベントが出たとき", sources: "日経 8/4；PR TIMES ナレッジワーク 8/4；マイナビ 8/6（リコージャパン提携・3000社目標）", note: "手の回として立てるならリコー側（営業網の外販）視点が本命。動機は薄い"}

  - {id: bl011, title: 本業が消える前に次を試す, gist: "スパークプラグ大手の日本特殊陶業が、岐阜の自社工場の一角に燃料電池・太陽光・蓄電池を組み合わせた実証施設N-Terraceを新設し、工場のエネルギー管理をまるごと試し始めた。EV化で本業が縮む前に、自分の工場を実験台にして次の商売の種をまく話", case_names: 日本特殊陶業;N-Terrace, industries: 自動車部品;エネルギー;セラミックス, field: 技術研究, subject: 会社, tech: 高, trigger_on: 2026-08-05, hand: OP06想定, motive: none, tailwind: TW4, found_on: 2026-08-13, found_in: ep010巡回, status: hand_weak, reason: "実証開始は現象で、誰に何を売って儲かるかの構造がまだ見えない", revive_when: "実証したエネルギー管理の外販・商品化など、売り物になる形が発表されたとき", sources: "レスポンス 2026-08-05（実証開始）", note: "本業消失を見越した転換は語り口として強いが、手が立つのは商品化のタイミング"}

