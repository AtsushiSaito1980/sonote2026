# ボツネタ棚 — 巡回で挙がったが、その回では選ばなかったネタ
#
# 目的：良いネタを二度と探し直さないこと。
# /patrol は毎回、(1) この棚を先に読んで復活できるものを拾い、
#           (2) 選ばれなかった候補をここへ書き出す。
#
# status は「なぜ見送ったか」であり、そのまま「いつ復活するか」を決める。
#   trigger_wait   トリガ待ち  … 手は立つ。窓内の発表がまだ無い → 発表が出たら復活
#   trigger_stale  鮮度切れ    … トリガはあったが31日窓を外れた → 続報で復活
#   hand_weak      手が立たない … 現象ではあるが商売の手に落ちない → 別の角度が見つかれば復活
#   overlap        直近と被る  … 手・業界が直近5回と重なる → 数回あけたら復活
#   unverifiable   裏取り不能  … 一次資料に到達できない → 資料が公開されたら復活
#   used           別回で消化  … 他の回に組み込んだ（復活しない・記録のみ）
#   dropped        見送り確定  … 復活の見込みなし（記録のみ）
#   idea           種のまま    … 手も日付もまだ無いが、面白いと思って拾った。育つのを待つ
#
# gist は「で、どんな話だったか」を、記号も内部用語も使わない普通の日本語で1〜2文。
# 半年後に棚を眺めたとき、これだけ読めば中身を思い出せることが条件。省略しない。
#
# ---------------------------------------------------------------------------
# 欄（1行1件・facts.yaml と同じフロー記法）
#
#   id title gist          … 何の話か
#   case_names industries  … 題材と業界
#   field subject tech     … 畑／主役／技術度。**ばらつきの軸で棚を引くための欄**。
#                            「いま制度公共が7回あき」と分かったとき、棚から
#                            制度公共のネタだけを拾えるようにするためにある
#   trigger_on             … 見つけたトリガの日付。鮮度切れの度合いが分かる
#   hand motive tailwind   … 手OP／動機MO／風TW の見立て
#   found_on found_in      … 見つけた日と、どの回の巡回か
#   status reason revive_when … 見送りの理由と、復活の条件
#   score                  … 採点したときの点数（面白さ/応用）。任意
#   sources note           … 手がかりと、使うときの注意
#
# **全部の候補を残す。**5〜7件の一覧に載せる前に落としたものも、
# 種（status: idea）として置いておく。探し直すコストのほうが高い。

entries:
  - {id: bl001, title: 解体材の行き先, gist: "大阪・関西万博の大屋根リング（世界最大級の木造建築）を解体して出た大量の木材が、どこへ引き取られ、何に生まれ変わるのか。イベントの終わりに出る廃材が、値段のつく原料として次の商品へ回っていく話", case_names: 万博大屋根リング木材リユース, industries: 建築;木材;イベント跡地, field: 産業BtoB, subject: 会社, tech: 低, trigger_on: 2026-01, hand: OP06, motive: MO3想定, tailwind: none, found_on: 2026-08-08, found_in: ep002巡回, status: trigger_wait, reason: "引取先の発表が2026年1月で、以降に窓内の動きが無い", revive_when: "実際の再利用先や加工品の販売開始が発表されたとき。跡地の再開発計画も同系統", sources: "2026-01 引取先発表", note: "OP06拾うの本命候補として温存。ep008でOP06を味として使ったため、主役で使うなら間を空ける"}

  - {id: bl002, title: 排出枠という商品, gist: "2026年度から大企業に義務化される排出量取引で、CO2を出す権利そのものが売り買いできる商品になる。減らせた会社が余った枠を売り、減らせない会社が買う——義務が新しい市場と値段を生む話", case_names: GX-ETS排出量取引2026年度義務化, industries: エネルギー;製造;金融, field: 制度公共, subject: 制度, tech: 低, trigger_on: , hand: OP14味, motive: none, tailwind: TW1, found_on: 2026-08-12, found_in: ep009巡回, status: trigger_wait, reason: "初年度の届出・移行計画の期限が2026-09-30と確定（ep013巡回で確認）。ただし窓内の公開物がまだ無くP1✗", revive_when: "9/30期限の前に、受付開始・説明会・様式公表など窓内の公開物が出たとき（8月末〜9月に出る可能性が高い）。畑=制度公共・主役=制度の◎2軸に合致するため、出たら最優先", sources: "制度資料；経産省リーフレット（届出期限2026-09-30・移行計画提出）；産構審詳細設計とりまとめ（2025-12・基準価格1トン1700円）", note: "ep002「施行日は開店日」の続編にあたる。同じ手の再演にならないよう、排出枠が商品として売買される側面に寄せる。儲け手は算定・検証・取引仲介サービス"}

  - {id: bl003, title: 配送設置網を束ねる, gist: "店では競争しているヤマダやエディオンなどの家電量販とメーカーが、配送と設置だけを共同でやる会社を作る構想。冷蔵庫や洗濯機の配達は、時間指定・再訪問・設置工事・古い機械の引き取りが重なる難所で、1社では効率が上がらない", case_names: ヤマダHD;エディオン;家電製販の共同物流, industries: 家電;物流;小売, field: 産業BtoB, subject: 会社, tech: 低, trigger_on: 2026-06-05, hand: OP08, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: trigger_stale, reason: "統合合意の発表が2026年6月5日で、31日の窓を外れていた", revive_when: "最終契約・新会社設立・共同物流会社の始動など、次の日付イベントが出たとき", sources: "logi-today 960951／960654；日経（ヤマダHD・パナソニックHDら10社超の共同物流会社構想）", note: "売上高合算で2.5兆円規模。配送設置のラストワンマイルは時間指定・再訪問・工事待ち・旧品回収が重なる難所で、束ねる価値が説明しやすい。ep007でOP08を味として使ったため、主役なら間を空ける"}

  - {id: bl004, title: 消費財サプライチェーンの標準化, gist: "洗剤や食品などを作る・卸す・売る43社が集まり、バラバラだった商品コードや段ボール・パレットの規格を揃えて、一緒に運ぶことを目指す協議会。各社が自社仕様を通してきたぶんのコストが、誰の財布から出ていたのかという話", case_names: 消費財サプライチェーン標準化協議会;製配販43社, industries: 消費財;卸;物流, field: 産業BtoB, subject: 会社, tech: 低, trigger_on: 2026-05-27, hand: OP08, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: trigger_stale, reason: "協議会の設立が2026年5月27日で窓外", revive_when: "標準コードの適用開始、共同物流の実運用開始など、協議会の成果が出たとき", sources: "logi-today 956823", note: "商品・事業所コードの標準化、物流資材の標準化、共同物流の実現を掲げる。bl003と同じOP08なので、どちらかを選ぶ形になる"}

  - {id: bl005, title: 8月の値上げ849品目, gist: "2026年8月だけで食品849品目が値上げ。中身を見ると、上がっているのは原材料そのものより、包装・物流・人件費のほう。値上げの理由が「材料が高い」から「運ぶ人・作る人が足りない」へ移りつつある", case_names: 帝国データバンク 食品主要195社 価格改定動向調査, industries: 食品;日用品, field: 生活消費, subject: 統計, tech: 低, trigger_on: 2026-07-31, hand: none, motive: none, tailwind: none, found_on: 2026-08-09, found_in: ep007巡回, status: used, reason: "T1の事例回としては手が立たなかったが、ep011でT4数字回（統計の中の物語）として消化", revive_when: "復活しない（記録のみ）。個社の値上げ以外の打ち手が見つかったら、それは別件として新規に起こす", sources: "帝国データバンク調査（TDB 2026-07-31公表の8月版で全面更新：8月2,311品目・9月4,531品目）", note: "ep011（2026-08-13制作）で使用。9月4,531品目は年内最多・単月2023年10月以来。要因の主役が包装・資材と中東情勢に移った点が物語の芯"}

  - {id: bl006, title: 障害者雇用率2.7%への引き上げ, gist: "企業が守るべき障害者の法定雇用率が2.7%へ上がった。注目したいのは制度そのものではなく、その受け皿として育っている商売のほう——仕事ごと請け負う特例子会社や、貸農園型のサービスなど、雇用率を満たしたい会社に売る事業が伸びている", case_names: 改正障害者雇用促進法, industries: 人事労務;特例子会社;人材, field: 制度公共, subject: 制度, tech: 低, trigger_on: 2026-07, hand: OP11想定, motive: none, tailwind: TW1, found_on: 2026-08-09, found_in: ep007巡回, status: overlap, reason: "ep002「施行日は開店日」と同じ制度回・TW1で、手も乗るになり重複感が強い", revive_when: "ep002から数回あけたあと。または雇用率対応が生んだ具体的な商売（特例子会社の受託事業など）が見つかったとき", sources: "2026年7月施行", note: "制度そのものではなく、義務化で生まれた受け皿側の商売に寄せれば別の回になる"}

