notes: |
  ・**同じ窓から3本目。**人間が「もっと振り切ったものを」と指示し、窓を4回舐め直して選んだ。
    面白さ100は44本で最高値。**そのかわり✗熱を5つ踏む**（型T1が国内6連続・畑技術研究・
    主役会社・技術度高・動機なし）。理由は selection.yaml に記録済み
  ・**制作上の最大の課題は ep042（さかなドリーム）との書き分け。**2本前に「天然にいない魚を作る」を
    やっており、畑も主役も技術度も同じ。**必ず守ること**：
    - **「天然にいない」「人工の肉」「本物ではない」という言い方を使わない**
    - **焦点を食べ物ではなく、工場と規制の時間差に置く**
    - **「値段を自分で決める」の筋立てをしない**（ep042 の芯そのもの）
    - **台本内で ep042 に言及しない**（ep020→ep014 の先例）
  ・**咀嚼の3拍**：
    ①培養肉はまだ研究の話だと思っていた → **工場のラインを建てる話だった。**
      食品衛生の国際手法に沿ったラインを新設し、来年1月に試験生産
    ②売れないのに建てるのか、と思った → **売れないうちに建てるから間に合う。**
      指針ができてから建て始めたら、建つころには解禁から何年も経っている
    ③何を根拠に「たぶん通る」と分かるのか、と思った → **まだ無い指針に合わせているのではない。
      もうある国際手法に合わせている。**新しい規制は、たいてい既存の枠組みを土台にする
  ・**この回の芯は③。**手（OP05）は時間のずらしだが、**ずらしを可能にしているのは
    「既にあるルールに乗せておく」という判断**のほう。解剖はそこに置く
  ・**数字は4つ**（balanced 上限5）：①来年の一月（試験生産）②約一か月（培養から成形まで）
    ③百グラム四千五百円（価格目標）④二〇二三年（事業体の発足）
    ※ **商業化の年度は使わない**——読売が2030年度、コンソーシアム公式が2031年で食い違うため
  ・**固有名詞は6つまで**：大阪大学／ハサップ／島津製作所／トッパン。実際は4つに収める。
    **コンソーシアムの正式名称は長いので「共同の事業体」と呼ぶ。個人名は出さない**（§3）
  ・『』は1〜2回：「本物に近い形状を持つ培養肉の生産ラインは世界初」（報道の言い方）
  ・**論評しないもの**：培養肉の安全性・是非・受け入れの可否。**畜産の環境負荷の数字は
    全成果物で使わない**（是非論が主題になる／ng.yml）。海外企業との比較もしない
  ・**裏取りの弱点（人間確認をお願いしたい）**：**HACCPライン・2027年1月・約1か月・
    100g4,500円・2030年度は、すべて読売新聞オンライン1系統。**他媒体は転載か言及で、
    独立した2系統目にならない。**台本は「報じられたところによると」の形にする**
  ・時期の明示（§4）：試験生産は「来年の一月」、事業体の発足は「三年前」、
    サシを再現した技術の発表は「五年前」
