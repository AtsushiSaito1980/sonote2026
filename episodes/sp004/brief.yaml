notes: |
  ・**三つの軸**：①数える単位（何を数えて代金が決まるか）②順番（作る→売るの向き）
    ③仕入れる場所（誰かが捨てている／使っていないもの）。40本を並べ直して出てきた形
  ・**ラジオ用（5分）は3例、読み上げ用（15分）は7例。**同じ回でも別物として書く
    - ラジオ：monday.com／NOT A HOTEL／リファインバース
    - 読み上げ：＋Skyfall（単位）・クラダシ／akippa（仕入れる場所）
  ・**固有名詞は台本に出さない。**「仕事の段取りを管理する、海外のソフト会社」のように
    説明語で置く。総集編は題材が多いので、名前を並べると耳が持たない（§9-3の考え方を国内にも適用）
  ・**数字は各回の facts.yaml にあるものだけ。**新しく調べ直さない。時点のある数字
    （NOT A HOTELの完売・規模）は「去年の二月の時点で」と時期明示（§4）
  ・**読み上げ版の「強弱・メリハリ」**（人間の指定）：
    - 人の場面を2つ入れる（傘を三百円で売った話／『ヤケクソでつけた名前です』）。
      構造の説明が続くと平板になるので、人の話で起伏を作る
    - 数字だけを並べる短い段落を1つ置いて、速度を変える
    - 三つの軸の切り替わりで、必ず一度立ち止まる（「ここまでがひとつめです」）
    - 段落の長さを意図的にばらつかせる。長い説明のあとに、短い一行を置く
  ・『』はラジオ1回（不動産で、のくだり）／読み上げ2回（＋ヤケクソの命名）
  ・**評価語を貼らない。**クラダシの赤字が続いた期間、akippaの4割減も、値踏みせず事実のまま
  ・トリガの窓：総集編は巡回で選んだ回ではないので、鮮度は代表値で見る
