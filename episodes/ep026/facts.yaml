  - id: F01
    text: "米VSEは2026年8月5日、Q2決算を発表。売上4億4,910万ドル（前年同期比65.0%増）、GAAP純利益2,850万ドル（109.1%増＝ほぼ2倍）でいずれも最高水準。通期ガイダンスも引き上げた（売上成長61〜64%へ）"
    confirmed_by: [S1a]
    verify: verified   # 会社IR一次
    note: アンカー。台本では「八月五日」。ドルはドルのまま

  - id: F02
    text: "セグメント別では修理・サービス（MRO）売上が149.4%増、部品の流通売上が17.2%増。オーガニック成長は約14%で、会社は商用エンジンのアフターマーケットの強さを理由に挙げた"
    confirmed_by: [S1a]
    verify: verified
    note: Q1の柱。「直す」が「売る」より速く伸びている

  - id: F03
    text: "事業は2本柱：エンジンや機体まわりの部品を仕入れて売る「流通」と、持ち込まれた部品を直して返す「修理（MRO）」。顧客は商用・ビジネス・一般航空。機体も路線も持たない"
    confirmed_by: [S1a]
    verify: verified
    note: 「車検場と部品商の飛行機版」の言い換えで説明

  - id: F04
    text: "2026年5月5日、社史上最大となる約20億2,500万ドル（現金＋株式）でPrecision Aviation Group（PAG）の買収を完了。CEOは「世界トップクラスの独立系アフターマーケット企業を目指す」という趣旨を述べた"
    confirmed_by: [S1a]
    verify: verified
    note: 『』は趣旨再現の枠で。台本ではPAGを「同業の専門会社」と言い換え

  - id: F05
    text: "VSEは1959年設立の67年目の会社。祖業は米政府向けのエンジニアリング・ロジスティクス。2024年に連邦・防衛サービス部門を売却し、2025年4月には車両部品（フリート）部門も約2億3,000万ドルで売却。航空アフターマーケット専業となり、航空売上が社史上初めて10億ドルを突破した"
    confirmed_by: [S3a]
    verify: partial    # 沿革はIR・年次報告・解説の一致。フリート売却額は検索要約→売却リリースで裏取り
    note: 咀嚼②の核。「祖業を全部売って一点に絞った」

  - id: F06
    text: "背景に新造機の不足がある。納入はコロナ前の生産トレンド比で5,300機以上不足し、受注残は17,000機超。エアバスは2026年の納入減少を確認（エンジン供給の遅れ）"
