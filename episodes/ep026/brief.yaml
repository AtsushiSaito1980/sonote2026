  ・『』1回：『世界でいちばんの、独立系のアフターマーケット企業になる』（CEOコメントの趣旨再現・「という趣旨」の枠で）
  ・咀嚼の3拍：①航空で儲かる会社は作るか飛ばすかだと思っていた→部品と修理だけ
    ②祖業は大事に残すものだと思っていた→67年目の会社が祖業を全部売った
    ③絞ったら小さくなると思っていた→絞った一点で史上最大の買収
  ・時期の言い回し：放送9/9想定。「八月五日」「ことし五月」— 今月/先週は使わない
