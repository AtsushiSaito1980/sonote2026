  ・**海外回の5ルール（CLAUDE.md §9）**：
    1. 決算は会社IR一次で確定済み。市場背景は業界メディア複数系統（IATA・Oliver Wyman原資料は人間裏取りへ）
    2. 金額はドルのまま。記号（$）は書かない。円換算しない
    3. 固有名詞は「VSE（ブイエスイー）」の1系統だけ。PAG→「同業の専門会社」、ボーイング等→「機体メーカー」、
       P&W→「エンジンメーカー」、NorthStar→言わない
    4. 供給網の混乱は地形として扱う。関税・防衛の文脈に触れない
    5. **解剖の三点目は日本への置き換え**：エレベーター・工作機械・発電設備など「長く使われる機械」の
       保守・部品・延命は日本の得意技。「自社の商品の買ったあと」を売上に数え直す問いへ
  ・数字は4系統設計（balanced上限5・余裕1）：
    ①決算（四億四千九百万ドル・65%増／修理149%増・流通17%増／純利益2倍）
    ②買収（約20億ドル・ことし五月・社史上最大）
    ③来歴の時期（一九五九年・二〇二四年・二〇二五年・八月五日）
    ④市場の背景（納入不足五千三百機・機齢十三年）
