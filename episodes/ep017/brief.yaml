  ・数字は3系統設計（余裕2）：
    ①時期（先月一日・十月一日・二〇二七年・二〇〇二年※東京・上半期）
    ②広がり（17→約50・ことし約30自治体・上半期の同意19件）
    ③税額の設計（200円・3%・1.2%で上限1,200円・免税点なし）
  ・固有名詞：自治体名はすべて純粋な地名で系統外。系統は**総務省**（同意の主体）の1つのみ。東芝テック等ベンダー名は不使用
  ・『』2回：Q01（特別徴収の仕組み）／Q02（熊本『予約した時期を問わず…』）
  ・主役「制度」回の核ガード：儲け手を具体に置く——①自治体（新財源） ②対応する事務・システムの特需 ③費用側＝徴収を担う宿。
    「税の解説」で終わらせず、**課金設計の教科書**として聞かせる（定率/定額/免税点/免除の思想）
  ・政治的賛否の回避（ng.yml）：増税の是非・観光公害の善悪には立ち入らない。設計の違いを事実で並べる
