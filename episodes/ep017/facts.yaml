notes: |
  ・アンカー＝BB宿泊ラボの最終更新2026-08-04（10日前）。公開7/13は32日前で窓を1日外れるため、更新日採用をreviewで開示
  ・density: balanced。数字3系統（余裕2）：
    ①時期（先月一日・十月一日・二〇二七年・二〇〇二年・上半期）
    ②広がり（17→約50・約30自治体・同意19件）
    ③税額の設計（200円・3%・1.2%と上限1,200円）
  ・固有名詞1系統：総務省のみ。自治体名は純粋な地名として系統外（熊本・宮崎・那須・盛岡・山形・苫小牧・北広島・稚内・富士吉田・富士河口湖・名護・東京・北海道・松江・沖縄・長崎）——ただし読み上げの負荷を考え、台本で並べるのは6地名程度まで
  ・『』はQ01・Q02。口癖1回・例え話2まで
  ・核ガード：「税の解説」でなく「課金設計の教科書」。儲け手（自治体の新財源・対応特需）と費用側（宿の事務）を必ず置く
