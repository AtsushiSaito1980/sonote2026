facts:
  - id: F01
    text: "2026年8月14日、オーディオストック株式会社の東京証券取引所グロース市場への新規上場が承認された。上場予定日は2026年9月16日"
    confirmed_by: [S1a, S1b, S1c]
    verify: verified   # 株主セレスの公式リリース＋報道＋IPO開示まとめの3系統
    note: アンカー。放送9/2想定のため台本では「八月十四日」「九月十六日」と月を明示

  - id: F02
    text: "事業は「クリエイターが制作したBGM、効果音、ボイス・ナレーションなどの音源の著作権を管理し、収益化する音源ライツビジネスプラットフォーム」。収益は①単品販売・定額制販売 ②放送利用による著作権・著作隣接権収入 ③Apple Music・Spotifyなどへの配信収入の3本柱"
    confirmed_by: [S1c]
    verify: verified   # IPO開示の事業内容欄
    note: Q1の芯。台本では「買い切り・定額・放送・配信」と平易に言い換える

  - id: F03
    text: "取り扱い音源数は2024年11月に100万点を突破。内訳はBGM約46万点・効果音約49万点・ボイス約4万2,000点・歌もの約9,000点"
    confirmed_by: [S2a, S2b]
    verify: verified   # 会社の一次リリース＋業界紙
    note: 数字CO候補。**一昨年の十一月時点と時期明示**（「いま100万点」と言わない）

  - id: F04
    text: "クリエイターへの累計報酬分配額はサービス開始から11年で10億円以上（2024年11月時点）。登録クリエイターは3万6,000組以上（2024年12月時点）"
    confirmed_by: [S2b, S2c]
    verify: partial    # 分配額は業界紙（一次リリース由来）、3.6万組は検索経由の集約→人間裏取り推奨
    note: 時期明示必須。「一昨年時点で」

  - id: F05
    text: "2007年10月、岡山で創業（旧社名クレオフーガ）。創業時の自己資金は100万円。音楽投稿・コンテストのサイトから始まり、のちに音源のライセンス販売へ転換"
    confirmed_by: [S3a, S1c, S5]
    verify: verified   # 設立年月はIPO開示、経緯は本人インタビュー
    note: Audiostockサービス開始年（2013年ごろ）は逆算のため台本では年を言わない

  - id: F06
    text: "初期は音楽事業だけでは生計が立たず、システム開発の下請けで会社を支えた。2012年に東京進出しVC出資。2017年取材時点で従業員13名・営業はほぼ社長ひとり・顧客の約7割がCM・映画などの映像系法人・月4,000〜5,000点を審査"
    confirmed_by: [S3a]
    verify: dated      # すべて2017年9月取材の状況→「九年前の取材では」を必ず付ける
    note: 反対・制約・孤立の記録（動機回の必須要素）

  - id: F07
    text: "音楽業界の課題：著作権と著作隣接権が別々の主体に管理され、使いたい人は「どこに頼めばいいかわからない」。CDの売上が落ち、従来のやり方ではクリエイターへの印税は微々たるもの（2017年取材時の本人の課題認識）"
    confirmed_by: [S3a]
    verify: dated
    note: OP14の前提。「権利の面倒」を先にまとめて引き受けたのがAudiostockの発明

  - id: F08
    text: "IPO概要：想定価格1,040円・想定時価総額43.3億円・公開株数127万7,600株・吸収金額約13.2億円・主幹事SBI証券・仮条件決定8月28日。従業員28名（2026年7月末）・平均勤続7年"
    confirmed_by: [S1c]
    verify: verified
    note: 会社の身の丈系統。時価総額は「想定」を必ず付ける

  - id: F09
    text: "株主に写真素材大手のピクスタ（6.28%）、セレス、スペースシャワー系（3.36%）など。写真の「ストックフォト」の型と資本でもつながっている"
    confirmed_by: [S1a, S1c]
    verify: verified
    note: C1（音楽×ストックフォトの型）の裏付け。台本ではピクスタを「写真素材の大手」と言い換え、記事で実名

