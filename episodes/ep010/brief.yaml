notes: |
  ・キー数字は届出書転載のIPOナビ＋庶民のIPOで突合済み。EDINETのⅠの部原本での再確認を人間裏取り事項とする
    （本契約6,644社／ARR89.2億円／解約率月1.1%／3Q累計 売上70.5億・経常6.6億で黒字転換／
     投資ファンド保有約60%／想定時価総額約154億円・吸収金額約75億円・公募比率約1.2%・会社手取り6,176万円）。
  ・「42年ぶり・月3,500円→7,500円」は届出書系統の単独出典。国税庁・財務省の一次資料での確認を人間裏取り事項とする。
  ・不使用と決めた数字：自己資本比率0.3%（表の取り込み異常疑い）／PER・PSR等のバリュエーション議論（番組の目的外）。
  ・引用経由（Wellulu・日経→IPOナビ転載）の事実は台本で使わない：山陰の相談→地方シフトのV字回復エピソード、
    2017年健康経営で軌道、惣菜メーカー買収構想。使うなら原文到達が条件。
  ・時期明示が必要な事実：非課税枠拡大（2026年4月施行）、OFFICE DE YASAI開始（2014年4月）、創業（2012年9月）、
    優食子会社化（2025年10月）、米国Lumeal開始（2024年5月設立・検証済み）。
  ・個人名は台本に出さない（憲法§3）。創業者は「八百屋を開いた人」、助言者は「知り合いの経営者」等で扱う。
    転換の一言は媒体で表現が揺れる（collected.md参照）。台本では趣旨を保って一つに定め、note記事でのみ実名・出典列挙可。
  ・「健康経営」「福利厚生」は講義口調に寄りやすい。生活の言葉（会社がおやつ代を持ってくれる、等）へ言い換える。
  ・ep008（クラス：家具サブスク）と「オフィス向けサービス」の語り口が被らないよう注意。動機回の芯は
    「農業の販路を変えたくて始めた人が、八百屋で失敗して、売る場所ごと客の一日の中へ動かした」に置く。
