opposition: |               # 反対・制約・孤立の記録（すべて原文到達済み。詳細は sources/collected.md「動機素材」）
  ・周囲の反対：「農業なんて絶対うまくいかないだろうと言われていた」。うまくいかなければ会社員に戻ろうと考えていた（創業手帳）
  ・産直EC「Agrich」は約2週間で注文が止まり、サイト制作200万円・創業融資600万円が早々に尽きる（役員note・本人筆）
  ・2013年2月開業の麻布十番の八百屋は1日売上1万円前後。「粗利を時給換算したら絶対にバイトした方がマシ」。
    納涼船のビール注ぎとフットサル審判で生計を維持。売れ残りは夕方、知り合いの会社へ売り歩いた
  ・転換後も：預金が尽きかけ初外部資本500万円、きゅうり腐敗クレームに3日3晩、
    2015年夏MRR250万円時に2度目の資金ショート危機。「3歳と0歳の娘…食わしていけるのか…眠れなかった」（役員note・本人筆）
  ・黒字転換は2026年8月期3Q＝創業から約13年半（サービス開始から約12年）
