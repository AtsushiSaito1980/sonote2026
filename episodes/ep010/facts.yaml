  ・アンカー＝2026年8月12日の上場承認（制作日の前日）。上場日は9月11日予定＝未来の日付として扱う（「上場する」ではなく「上場が決まった」）
  ・density: narrative（型3）。数字は3系統以内・固有名詞は4系統以内・facts消化4点前後：
    ①時期（十三年・二〇一二年・二〇一四年・ことし九月十一日 等）
    ②100円（1品の値段。「原価より安い」の発見とセットで、この回の構造の芯）
    ③商売の規模の対比（八百屋の日商1万円 ↔ 本契約6,644社）
    → ARR89.2億・+85%・154億円・75億円・3,500→7,500円・62%・270社・7拠点は台本では数字を使わず言葉で扱うか触れない。正確値はnoteのデータへ
  ・固有名詞は4系統以内。使用：KOMPEITO（コンペイトウ）／オフィスでやさい／麻布十番／東証グロース
    不使用（一般名詞化）：キユーピー・鈴与→「食品メーカー」「物流の会社」、サムライインキュベート・各VC→「投資家」、
    Agrich→「産直の通販サイト」、ゼロワンブースター→「起業家の入る施設」、Lumeal・優食→台本では出さない
  ・F24〜F26・F30 は2012〜2015年の出来事。**台本・記事とも時期を明示すること（§4）**。「十三年前」「一昨年」等
  ・F08・F09・F14・F16 は届出書転載（IPOナビ）の単独系統。**EDINET原本・国税庁資料での再確認＝人間の裏取り対象**
  ・個人名は台本・記事の地の文で扱い分け：台本は「八百屋を開いた人」「知り合いの経営者」。note記事は実名・出典列挙可（憲法§3の独立媒体ルール）
  ・『』趣旨再現はQ01を第一候補、Q02を反対の記録として使用（最大2回の枠内）
  ・MO4（主）：コンサルで農業の販路の詰まりを見た／八百屋の店先で「その場で食べたい」を見た。
    MO6（副・解剖の材料）：Q06の「先に公言して追い込む」。動機の一般化は「見てしまった人は、見た場所を売場に変えた」方向で説教を避ける
