notes: |
  ・採点（selection.yaml ep012）：Q1○ Q2✗／C1〜C5すべて○／面白さ80・応用60。
    応用が低いのはタグがOP09の1本のため。台本は「手の解剖」を厚くして補う。
  ・数字は5系統で設計：
    ①時期（1961年・1991年・三年前に上場・先月なかば・ことし12月）
    ②シェアと寡占（約52%・参入7〜8社）
    ③交換需要（売上の8割以上・1〜2年で交換）
    ④業績（Q1営業37%減・進捗ほぼ5割＝計画線・前期137億円+24%・35年連続営業黒字・5期連続最高益・今期利益横ばい計画）
    ⑤粗利の二段（標準品30%未満・提案品50%程度）
    → 100万本・顧客分散12%/10%・日本156億vsアジア1,400億・2.2億円は台本では言葉に落とすか記事へ
  ・固有名詞はJRCのみ＋一般名詞（砕石場・ごみ処理施設等）。ベトナムは地名。東証グロースは言わず「三年前に上場」
  ・Q1数値は株探経由の単独系統 → **短信原本での突合が人間裏取り**。混同注意：経常▲36.3%／営業▲37.0%
  ・「トナー型」比喩は要約記事側の表現の可能性があるため使わない。交換の絵は「屋外で回り続けて1〜2年で傷む」で描く
  ・減益の扱い：隠さず最初に置く。「37%減でも会社が慌てない」→ 8割が交換需要で読める＋先行投資は計画どおり、の順で解く
  ・ep008（クラス）と同じ「地味な運用の強さ」系。芯の違い＝ep008は自社商品を回す設計、ep012は他社設備の消耗部品を握る寡占
