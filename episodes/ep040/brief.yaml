notes: |
  ・採点（selection.yaml ep040）：Q1○ Q2✗ C1◎ C2◎ C3◎ C4✗ C5○

  ・**ep032との書き分け（省略不可）**
    ep032（ケーキ屋）＝ 原価が全部上がる×ハレの日商品は値上げの天井が低い ＝ **コスト構造の話**。入口は「四十五件」という件数。
    ep040（芸能プロ）＝ 倒産理由の欄に人の出入りが並ぶ ＝ **事業が誰に付いているかの話**。入口は「倒産の理由を書く欄」。
    → 本回は件数から入らない。件数は中盤で出す。「小さい店から順に倒れる」という共通の形も、本回では使わない。

  ・**ep039との書き分け**：ep039（EU Data Act）も「囲い込みが前提でなくなる」話だが、あちらは
    データの持ち主が移る＝制度が外から囲いを外す話。本回は**そもそも囲えていない**（会社に何も残らない）話。
    台本で「囲い込み」「囲い」という語を使わない。

  ・数字は5系統に絞る（dense上限6）：
    ①件数（十六件・ことしの一月から八月・二〇一五年の十五件・通年で初の二十件台の可能性）
    ②規模（二〇二〇年以降の七十三件・資本金一千万円未満が五十七件＝約八割）
    ③業歴（設立十年未満が四十件＝五割強）
    ④集計の定義（負債一千万円以上・法的整理）
    ⑤時期（八月二十一日）
  ・固有名詞：0〜1系統。「信用調査会社の集計」と無名化。**個社名・タレント名は台本・記事・図版・概要欄のすべてで不使用**

  ・**扱い方の線引き（最重要）**
    「創業者の死去・体調不良」「マネージャーの離職」は、**誰かの落ち度ではない**。
    人はいつか体調を崩すし、辞めることもある。ふつうのことが起きただけで事業が止まるなら、
    それは人の話ではなく**事業の形の話**——という筋で書く。台本内で明示的にそう言う。
    憐れみ・値踏み・「かわいそう」を書かない。倒れた側を教訓の材料として消費しない。

  ・咀嚼の3拍：
    ①テレビが縮んだから大きい事務所が力尽きているのかと思った
      → 資本金一千万円未満が約八割、設立十年未満が五割強。新しく入った小さい事務所が十年もたずに消えている
    ②倒産の理由はお金の話だと思っていた
      → 創業者の死去・体調不良、マネージャーの離職が並ぶ。人の出入りが、そのまま理由の欄に載る
    ③抜けて痛いのは看板のタレントだろうと思った
      → マネージャーも抜ける。仕入れ側の関係も、売り先との関係も、両方が個人に付いている

  ・例え話1つ（dense要件）：工場の機械が毎朝「きょうは来ません」と言う可能性がある、という言い方（三崎の工程の言葉）

  ・『』1回：『特定タレントへの依存度が高い芸能プロでは収益基盤の維持が難しくなっている』（原文の趣旨）

  ・**出典に無いこと**：「依存度を下げた形なら残れる」は原文の裏返しであって明示ではない。
    台本では「という含みがあります」「見立てですが」の枠で出し、reviewに記録する。

  ・時期の言い回し：放送9/30想定。「八月二十一日に出た集計」「ことしの一月から八月まで」
