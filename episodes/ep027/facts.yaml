facts:
  - id: F01
    text: "人型ロボットのUnitree（宇樹科技）は2026年8月10日、上海のSTAR MarketでIPOを開始。発行価格150.80元、上場後の時価総額は約609.9億元（約90億ドル）。人型ロボットのメーカーとして初の大型上場となる"
    confirmed_by: [S1a]
    verify: verified   # 報道複数系統一致（目論見書での最終確認は人間へ）
    note: アンカー。台本では「八月十日」「上海の新興市場」

  - id: F02
    text: "2025年の売上は17.08億元、調整後純利益は約6億元。人型ロボットの同業スタートアップの多くが赤字の中で、利益を出している"
    confirmed_by: [S2a]
    verify: partial    # 登録書類ベースの報道→目論見書で確認
    note: Q1の証拠。「同業総赤字の中の黒字」

  - id: F03
    text: "四足ロボットGo2は1,600ドルから（上位版2,800ドル・開発用1万数千ドル）。同種で最も有名な米社の「Spot」は74,500ドルで、約46分の1の価格差。比較記事は「研究室はSpot1台の値段で開発用5台を置ける」と指摘する。人型のG1は16,000ドル"
    confirmed_by: [S3a]
    verify: partial    # 比較サイト複数一致→米社公式価格の時点確認は人間へ
    note: C2の核。台本では米社名を「アメリカの最有名どころ」と言い換え

  - id: F04
    text: "2025年の春節聯歓晩会（中国で最も視聴される年越し番組）で人型H1が16体、人間のダンサーと民族舞踊を披露。2026年の同番組ではパルクール・酔拳・ヌンチャクへ演目が「進化」した"
    confirmed_by: [S3b]
    verify: verified   # SCMP・Global Times
    note: C5の絵。「安かろう悪かろう」への反証として使う

  - id: F05
    text: "創業者は1990年生まれ。大学院入試で英語の点数が基準に届かず、第一志望に進めず配属先の大学へ。修士課程で四足ロボットXDogを自作した。当時非主流だった全電動駆動を選び、模型飛行機用のモーターで駆動部を自作してコストとサイズを大幅に削減。米有名社の電動化発表より1年早かった"
    confirmed_by: [S4a]
    verify: partial    # Baidu百科英語版→中国語圏の原典インタビューで補強推奨
    note: 動機の核。「金がないから安く作った」が会社の設計思想の origin

  - id: F06
    text: "修士修了後、有名なドローンの会社に入社したが約2ヶ月で退職。在職中に自作ロボットの動画が海外で拡散し、北京の個人投資家が自分から連絡してきて200万元を出資。2016年、杭州でUnitreeを創業した"
    confirmed_by: [S4a, S1b]
    verify: verified   # 複数系統一致
    note: 台本ではDJIを「有名なドローンの会社」と言い換え

  - id: F07
    text: "批判も記録されている。「いまの人型ロボットはリモコンのおもちゃではないか」という指摘があり、ある企業の年次会議では2体のロボットが階段を降りられず、スタッフに舞台から運び降ろされた場面が報じられた"
    confirmed_by: [S1b]
    verify: verified
    note: 反対・制約の記録（動機回の必須要素）。嗤いに使わず「まだ途中の技術」の事実として

  - id: F08
    text: "創業初期の心境について本人は「お金がなく、会社を辞めて、投資家の入金もまだで、大企業が参入してきたらと不安だった。その不安は以降のどの年よりも強かった」という趣旨を語っている"
    confirmed_by: [S1b]
    verify: verified   # 36kr英語版の引用（趣旨）
    note: 『』候補。孤立の記録

