facts:
  - id: F01
    text: "Bending Spoons（ミラノ）は2026年8月13日、上場後初の決算を発表。Q2売上は7億400万ドルで前年同期比126%増、調整後営業利益は3億8,100万ドルで150%増、調整後利益は167%増。いずれもアナリスト予想を上回った"
    confirmed_by: [S1a, S1b]
    verify: verified   # 公式配信＋IR＋報道複数系統（PDF突合は人間へ）
    note: アンカー。「八月十三日」

  - id: F02
    text: "保有ブランドはAOL・Brightcove・Eventbrite・Evernote・komoot・Remini・StreamYard・Tractive・Vimeo・WeTransferなど（IR公式一覧）。「愛されているが、弱っている」ネットのブランドを買収し、売却せず長期保有する"
    confirmed_by: [S1a, S3a]
    verify: verified
    note: 台本のロールコールはエバーノート・ウィートランスファー・ビメオ・AOLの4つに絞る

  - id: F03
    text: "2026年7月1日にNasdaq上場。公開価格29ドル・初日終値は+40%・初値評価は約180億ドル（IPO前の私募評価110億ドル）"
    confirmed_by: [S3a, S1b]
    verify: verified
    note: 「七月一日」

  - id: F04
    text: "買収は続いている。5月にペット追跡のTractiveを企業価値7億5,900万ドルで買収完了。Airtableを12億9,000万ドル全額現金で買収し、9月1日前後にクローズ予定。年初来の買収総額は企業価値ベースで約35億ドル"
    confirmed_by: [S2]
    verify: partial    # 報道複数→Airtable完了リリースで確認
    note: 台本ではTractive名は出さず「ペットの見守りサービス」等

  - id: F05
    text: "原点は失敗にある。創業者4人はミラノで約13年前（2013年）に創業。先行して作ったライフダイアリーアプリEvertaleは当たらず、この挫折から「才能と成功の相関は不完全で、運の役割が大きい」と認識した"
    confirmed_by: [S3a]
    verify: verified   # TechCrunch共同創業者取材
    note: 動機の核。台本ではEvertaleを「日記のアプリ」と言い換え

  - id: F06
    text: "上場書類F-1には「プロダクトマーケットフィットの発見には、運が大きな役割を果たす。しかし、卓越した運営の追求において、運は無関係だ」という趣旨が明記されている。共同創業者は「運の役割をできるかぎり小さくする戦略を見つけることに執着した」と語る"
    confirmed_by: [S3a]
    verify: verified
    note: 『』本命。哲学が上場書類に書いてある、が効く

  - id: F07
    text: "買収後は、AIによる機能実装の加速・価格の見直し・人員削減を含む効率化を行う。従業員1人当たり売上は2023年の112万ドルから2025年に257万ドルへ上がった。顧客の継続率は「驚くほど安定している」と共同創業者は述べる"
    confirmed_by: [S3a]
    verify: verified
    note: **人員削減は事実として1回だけ述べ、論評しない。**「買われた側にとって軽い話ではない」の一言で温度を保つ

