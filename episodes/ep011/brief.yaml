notes: |
  ・数値はすべてTDB一次（公表ページ本文）。単独ソースだが調査主体の一次発表そのもの。
    ページ末尾PDF（グラフ版）の目視突合を人間裏取りとする。
  ・数え方の注記（複数回値上げは別品目カウント／値上げ率は発表時の最大値／実質値上げ含む）を
    台本か記事のどちらかで必ず言う。数字回は数字の作られ方まで見せる。
  ・消費税8%→1%方針は台本不使用（政治的賛否が主題・config/ng.yml）。noteはTDB分析の伝聞1行まで。
  ・数字系統の設計（denseの上限6に対し5で設計し余裕1を残す）：
    ①月別の品目数（4,531／2,311／前年同月1,262＝8割増／2023年10月の4,758／10月2,720）
    ②通年（18,347／前年20,609／5年連続1万超／2万品目台）
    ③要因の内訳%（90.9／65.8／64.0／27.8）
    ④平均値上げ率15%
    ⑤時期（先月末の公表・九月・ことし 等）
    → 7月2,664・分野別の生数字（1,419等）・約7倍・2022年比較は台本では言葉に落とすか捨てる。正確値はnoteへ
  ・固有名詞：帝国データバンク（調査名込みで1系統）。中東・ホルムズ海峡・イラン等は地名扱いで系統外だが、
    台本では「中東で続く緊張」の水準に留め、国名の列挙はしない
  ・具体の芯：**鏡餅製品が8月に値上げ**（正月の棚の値段は夏に決まる＝値上げは半年先の棚から始まる）。
    トレー・フィルム・インク（包み）と物流費（運び賃）が品目数を押し上げた、というTDB自身の説明が物語の背骨
  ・聞き手（新規事業担当）への転換：値上げは「業界のコスト構造が公開される瞬間」。
    自社に届く値上げ通知の理由欄を、材料／包み・運び賃／人件費に分けて読むと、どのコストが動いているかが見える
  ・「原材料高90.9%が最多」を隠さない。押し上げの「増分」が包材・物流・中東由来という因果はTDBの記述に忠実に
