<!-- ep001 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">業界の全員が磨いてきた物差しを、逆さに持ち替えた。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M7 8v3M12 8v4M17 8v3"/></svg>
      <div class="ct">業界共通の物差し</div>
      <div class="cd">硬さ・磨く力・応援する快感</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18 3v3h-3M6 21v-3h3"/></svg>
      <div class="ct">逆さに持つ</div>
      <div class="cd">上限まで磨くのをやめる</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M3 21h13M20 21V9l-5-3"/><circle cx="12" cy="12.5" r="1" fill="currentColor" stroke="none"/></svg>
      <div class="ct">がら空きの逆側</div>
      <div class="cd">塞がれていた性能の、逃げ道</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：ミズノ／サンスター 各リリースほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="58.8%の人が力を入れて磨いてしまうことを示すドーナツ図">
        <circle class="track" cx="75" cy="75" r="60"/>
        <circle class="arc alt" cx="75" cy="75" r="60" stroke-dasharray="222 377"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">58.8<small>%</small></div>
      <div class="fl">適切な力は150〜200g、毛先が広がらない程度の軽さ。分かっていても<strong>「つい力を入れて磨いてしまう」人が58.8%</strong>。啓発では動かなかった数字。</div>
      <div class="fs">サンスター調べ（2025年12月・n=1,000）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>顧客を教育するのではなく、道具の側が折れた</span></div>
</figure>
