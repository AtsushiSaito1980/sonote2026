facts:
  - id: F01
    text: "ADEKAは2026年8月20日、先端フォトレジスト向け光酸発生剤（PAG）の生産能力増強を発表した。千葉工場（千葉県袖ケ浦市）の既存建屋内に生産ラインを増設し、投資額は約10億円、生産能力は従来比で約2倍になる"
    confirmed_by: [S1]
    verify: verified   # 会社リリース＋報道複数
    note: アンカー

  - id: F02
    text: "日程は2027年1月着工・2028年2月完成・2028年9月に営業運転開始。EUV（極端紫外線）や高NA EUVといった先端世代での需要拡大を見据え、供給体制の強化を2年前倒しで実行するとしている"
    confirmed_by: [S1]
    verify: verified
    note: 「2年前倒し」が効く

  - id: F03
    text: "光酸発生剤は、光を当てると酸を発生する物質。その酸がレジスト樹脂の溶けやすさを変え、光が当たった部分だけが現像で流れることで回路のパターンが描かれる。EUVの波長は13.5ナノメートルで、ArFより10倍以上短い"
    confirmed_by: [S2]
    verify: verified
    note: C5の絵。仕組みの説明

  - id: F04
    text: "同社は先端リソグラフィ（ArF・EUV）を重点分野と位置づけ、化学増幅型レジスト用のPAGや金属酸化物レジスト用の金属化合物の開発を進める。2026年7月に本格始動した半導体イノベーションセンター（埼玉県久喜市）では、次世代のPAGモノマーの開発・評価を加速している"
    confirmed_by: [S1]
    verify: verified
    note: 「極める」の裏づけ

  - id: F05
    text: "フォトレジストは日本の化学メーカーが世界シェアの大半を占めるとされる領域で、光酸発生剤もその一部を成す。同じ2026年8月には、他の化学会社も半導体向け素材の増産を相次いで発表している"
    confirmed_by: [S3, S4]
    verify: partial   # シェアは業界メディアの記述→一次統計での確認を推奨
    note: **「とされます」の伝聞1回のみ。%と社名は出さない**

