facts:
  - id: F01
    text: "東京商工リサーチの集計（2026年8月11日掲載）によると、ケーキ・菓子店（菓子小売業）の倒産は2026年1〜7月で45件。過去30年で同期間の最多を更新し、通年最多だった2025年の58件を抜くことが確実な情勢"
    confirmed_by: [S1a]
    verify: verified
    note: アンカー。台本では「信用調査会社の集計」と無名化

  - id: F02
    text: "倒産の約7割は資本金1,000万円未満の小・零細店舗で、破産が大半を占める"
    confirmed_by: [S1a]
    verify: verified
    note: 「小さな店から順に」の根拠

  - id: F03
    text: "材料費の高騰（バター・卵・小麦・砂糖など）と光熱費の複合高で、2025年度の洋菓子店の営業利益率は平均0.7%（帝国データバンクの2025年度調査）。洋菓子店の6割が業績悪化、倒産は前年度の1.3倍だった"
    confirmed_by: [S2a]
    verify: verified   # 5月公表＝窓外→「2025年度の調査では」と時期明示
    note: **500円×0.7%＝3円50銭は説明のための換算**（reviewに記録）

  - id: F04
    text: "400〜600円前後の中価格帯スイーツで、専門店級の品質を持つコンビニスイーツなどとの価格・獲得競争が激化。「手頃な街のケーキ屋さん」で特に苦境が鮮明"
    confirmed_by: [S1a]
    verify: verified
    note: 競合側は「工場でまとめて作り、全国に配る側」の構造表現まで（個社名なし）

  - id: F05
    text: "需要側の変化も指摘される。値上げにより帰省の手土産を我慢する動きや、贈答慣習の変化が影響している（TSRの分析副題）"
    confirmed_by: [S1a]
    verify: verified
    note: TW5。『』候補＝『値上げで、帰省の手土産も我慢』（副題の趣旨）

