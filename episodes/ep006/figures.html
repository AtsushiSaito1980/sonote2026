<!-- ep006 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<div class="cover-wrap">
<figure class="fig cover" data-fig="cover">
  <div>
    <div class="fig-kicker">その手があったか</div>
    <div class="cv-lesson">断られた理由を引く。</div>
    <div class="cv-title">17年無視された技術が、パネルの載らない屋根を市場にした</div>
  </div>
  <div>
    <div class="cv-stat"><span class="cv-n">4<small>%</small></span><span class="cv-cap">ノーベル賞候補の技術の、最初の変換効率</span></div>
    <div class="fig-foot"><b>その手があったか</b><span>なんで、それで儲かるんですか？</span></div>
  </div>
</figure>
</div>

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">重さを引いた技術を17年寝かせ、パネルが載らなかった屋根に載せた。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
      <div class="ct">重さを引く</div>
      <div class="cd">ガラスと架台をやめ、フィルムにする</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <div class="ct">17年、待つ</div>
      <div class="cd">効率4%から実用まで寝かせる</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
      <div class="ct">載らなかった屋根が市場に</div>
      <div class="cd">体育館・風車・水田・駅ホーム</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：積水化学工業 公式（SOLAFIL 事業開始）ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="最初の論文の変換効率が4%だったことを示すドーナツ図">
        <circle class="track" cx="75" cy="75" r="60"/>
        <circle class="arc alt" cx="75" cy="75" r="60" stroke-dasharray="15 377"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">4<small>%</small></div>
      <div class="fl">いまノーベル賞候補に挙がる技術の、最初の論文の変換効率は<strong>わずか4%</strong>。10%を超えれば世界中が追試するが、4%では誰も振り向かなかった。そこから17年。</div>
      <div class="fs">2008年の最初の論文。現行のSOLAFILは15%（目標20%）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>世界に無視された17年が、いま量産の競争に入っている</span></div>
</figure>
