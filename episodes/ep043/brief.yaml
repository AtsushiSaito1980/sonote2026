notes: |
  ・**ep042 と同じ日・同じ窓から2本目。**窓が動いていないので、候補は ep042 の巡回と重なる。
    人間が「動機の立つ回」を優先して選んだ
  ・**この回の芯は技術ではなく支払い。**モーターで動く義足という商品の話に見せて、
    着地は「払う側の償還表にコードが載るまで、それは商品ではない」に置く。
    L5859 が承認されたのは2024年5月24日で、**日本を含むアジアのメーカーの義足膝では初**
  ・**倫理線を最優先で運用する（省略不可）**：
    - 切断を感動の材料にしない。「乗り越えた」「勇気をもらう」類の言い方をしない
    - **不便を数えて道具にした人**として書く。人格ではなく、やったことを書く
    - 中国と日本の支援制度の差は事実として置き、優劣を論評しない
    - 転倒の場面は本人が署名記事で公開している範囲に留め、脚色しない
  ・**咀嚼の3拍**：
    ①モーターで動く義足がすごい話だと思っていた → **売れるようになったのは保険のコードが付いたから**
    ②コードは新しく作ってもらったのだと思っていた → **コードはもとからあった。**
      そこに載るのが、アジアのメーカーでは初めてだった
    ③当事者だから作れた話だと思っていた → **当事者だから、不便を数えられた。**
      いつ、どこで、どう転ぶかを、自分の記録として持っていた
  ・**数字は3つ**（narrative）：①九歳（切断）②五つ（承認されたコードの数）③二〇一八年（創業）
    ※ 累計調達額19億円・シリーズA 9.2億円・従業員17名は**台本で使わない**
      （19億円は二次のみ、17名は2021年時点で古い）。読み上げ版と記事に回す
  ・**固有名詞は4つまで**：BionicM／Bio Leg／東京大学／アメリカ。
    ※ アメリカは純粋な地名なので数え方を review.md に書く。前職の社名は出さない
  ・**個人名は出さない**（§3）。「この会社を作った人」「創業した人」。
    記事では実名（孫小軍氏）を書く
  ・『』は2回：「自分の脚を作れないか」／「もっと会社に勤めた方がいいよ」
  ・**言い切ってはいけないこと**：保険が効いて患者の自己負担がいくら下がるかは一次に無い。
    Bio Leg の価格・販売台数も無い。**日本の補装具費支給制度での扱いは確認できていない**ので、
    米国の話と混ぜない
  ・時期の明示（§4）：受賞は「今週」、コードの承認は「おととしの五月」、
    創業は「二〇一八年」、本人の記録は「五年前に本人が書いたもの」
  ・**ep041 との書き分け**（3本前・同じ医療機器）：ep041 は「相手の消耗品費が下がる形で売る」、
    この回は「払う側のコード表に載って初めて売れる」。どちらもお金の出どころの話だが向きが逆。
    **台本内で ep041 に言及しない**
  ・**ep036 との書き分け**（同じ OP11）：ep036 は制度が**需要**を作る話、この回は制度が**支払い**を
    作る話。「線を引く」「義務」の語を主軸に使わない
