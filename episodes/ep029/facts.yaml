facts:
  - id: F01
    text: "Duolingoは2026年8月5日にQ2決算を発表。毎日の利用者（DAU）は5,870万人で23%増（前四半期から加速）、有料課金者は1,270万人で17%増、売上は2億9,850万ドルで18%増。通期は売上12.1億ドルの見通し"
    confirmed_by: [S1a]
    verify: verified   # 公式配信＋複数系統（IRのPDF突合は人間へ）
    note: アンカー。「八月五日」

  - id: F02
    text: "創業者はCAPTCHA（「私はロボットではありません」の歪み文字認証）の発明者のひとり。本人の計算では、当時1日およそ2億回・1回約10秒、合わせて毎日50万時間超が認証に費やされていた"
    confirmed_by: [S2a]
    verify: verified   # 本人TED（2011年時点の数字）
    note: 数字CO。**「当時の本人の計算で」と時期を枠づけ**

  - id: F03
    text: "その無駄を拾い直したのがreCAPTCHA。表示される2語のうち1語は、古書や新聞のスキャンで機械が読めなかった単語で、入力のたびに人類の無駄時間が本のデジタル化に変わる仕組み。2009年にGoogleが買収した"
    confirmed_by: [S2a]
    verify: verified
    note: OP06味の来歴。「悔いて、拾い直した」

  - id: F04
    text: "創業者は1978年グアテマラ生まれ。お金のある家は良い教育を買え、ない家は読み書きからも遠い現実を見て育ったと、複数のインタビューで一貫して語っている。2011年、教え子とDuolingoを創業。ミッションは「教育を無料で、誰にでも」"
    confirmed_by: [S2b]
    verify: verified   # 英語圏インタビュー複数の趣旨一致
    note: MO4の核。『』候補（趣旨再現）

  - id: F05
    text: "初期のDuolingoは、学習者の翻訳演習を報道機関などに売るモデルだった（reCAPTCHAと同じ「無駄を仕事に変える」設計）。のちにこのモデルを離れ、ゲームの当たり前——連続記録・リーグ・督促する緑のフクロウ——を教育に持ち込むフリーミアムへ転換した"
    confirmed_by: [S2b]
    verify: partial    # 転換の経緯は複数記事の一致（契約先名は未確認→「報道機関など」の水準）
    note: 方向転換の記録（動機回の制約・反対要素）。OP13主役の根拠

  - id: F06
    text: "現在の構造は「無料で学べて、広告と課金が支える」。毎日5,870万人が使い、うち1,270万人が有料課金。純利益3,320万ドル・調整後EBITDAマージン25.9%と、無料配布のまま利益が出ている"
    confirmed_by: [S1a, S2b]
    verify: verified
    note: Q1の答え。「無料で配って、続けさせて、一部が払う」

