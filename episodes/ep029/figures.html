  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="2"/><path d="M8 11h2m2 0h2m2 0h1M8 14h8" opacity=".7"/></svg>

      <div class="cd">認証・入力・待ち時間。毎日50万時間が捨てられていた</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="8.5" cy="12" r="1.5"/><path d="M14 10.5v3m-1.5-1.5h3"/></svg>

    </div>
    <div class="cop">＝</div>
