    <div class="cv-lesson">天然にいない魚を作って、値段を自分で決める。</div>
    <div class="cv-title">カイワリを金アジに産ませる。天然にいない魚をつくって、値段を自分で決める</div>

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">市場にほとんど出回らない魚の子を、育てやすい魚に産ませる。生まれたのは天然にいない魚なので、天然と値札を並べようがない。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24" fill="none"><path d="M2 12c4-5 9-6 13-4 2 1 4 2 7 4-3 2-5 3-7 4-4 2-9 1-13-4Z"/><circle cx="8" cy="11" r="1" fill="currentColor" stroke="none"/></svg>
      <div class="ct">出回らない魚</div>
      <div class="cd">漁獲が不安定で養殖も難しく、市場にほとんど並ばない</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24" fill="none"><path d="M3 13c3-4 7-5 10-3 2 1 3 2 5 3-2 1-3 2-5 3-3 2-7 1-10-3Z"/><path d="M18 8v10"/><path d="M21 10v6"/></svg>
      <div class="ct">育てやすい魚</div>
      <div class="cd">卵や精子のもとになる細胞を移され、代わりに産む親になる</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></svg>
      <div class="ct">比べる相手がいない</div>
      <div class="cd">天然にいない魚なので、天然と値札を並べようがない</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：科学技術振興機構「大学発ベンチャー表彰2026」（2026/8/27）・さかなドリーム リリース（2026/2/18）</span></div>
</figure>
