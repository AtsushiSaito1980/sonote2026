    text: "日本の海面養殖魚の生産量は、わずか5種で9割以上を占める"
    confirmed_by: [S3]
    verify: partial
    note: "**この回の入口の数字。**品揃えが薄いことが、単価を決められないことの原因になっている"
  - id: F05
    text: "日本の海には4,000種を超える魚がいるが、流通している魚は100種に満たない"
    confirmed_by: [S3]
