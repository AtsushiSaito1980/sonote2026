    verify: verified
    note: "**アンカー（3日前・窓内）。**JST・NEDO・文科省・経産省の共同発表で一次が4系統ある。
      台本では『今週』として扱う"
  - id: F02
    text: "受賞理由は、代理親魚技法を使って希少魚の完全養殖と安定生産を実現したこと、高級養殖魚の開発とブランド化を通じた水産業の高付加価値化、および育種から販売まで一貫したビジネスモデルを構築している点"
    confirmed_by: [S1a]
    verify: verified
    note: "**『育種から販売まで一貫』が主催者側の評価にも入っている。**この回の芯（出口を自分で握る）
      が、こちらの見立てだけでなく評価文にも現れている"

