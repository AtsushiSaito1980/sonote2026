    text: "品揃えが5種に偏ると商品の差別化が失われ、養殖業者が自分で販売単価を決められなくなる。単価が上げられないので増産に傾き、供給過多で相場が下がってさらに赤字になる循環に入る"
    confirmed_by: [S3]
    verify: partial
    note: "**この回の解剖の一。**技術の話ではなく、値段を誰が決めるかの話"

