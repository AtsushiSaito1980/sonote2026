  # --- 技術 ---
  - id: F11
    text: "代理親魚技法は、ある魚の卵や精子のもとになる生殖幹細胞を、別の種類の魚の稚魚に移植し、育った親魚に元の魚の卵や精子を産ませる技術"
    confirmed_by: [S5, S6]
    verify: verified
    note: "説明はここまで。**細胞の種類や手技の詳細には踏み込まない**（耳で追えなくなる）"
  - id: F12
    text: "2007年9月14日、ニジマスの精巣細胞をヤマメに移植して、ニジマスだけを産むヤマメの親を作ることに成功したと発表された。同じ発表のなかで、サバのような小型で飼育しやすい魚にクロマグロの卵や精子を産ませる技術への期待が示されている"
    confirmed_by: [S5]
    verify: verified
    note: "**技術の起点＝約19年前。**サバにマグロは**まだ実現していない。**
      2007年の発表に『可能か？』と書かれている、という形で構想として語る"
  - id: F13
    text: "クロマグロは成熟するまでに3〜5年かかり、サバは1年で成熟する"
