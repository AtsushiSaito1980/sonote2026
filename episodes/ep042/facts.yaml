  - id: F01
    text: "大学発ベンチャー表彰2026で、東京海洋大学発のさかなドリームが科学技術振興機構理事長賞を受賞。発表は2026年8月27日、応募41件から最終ノミネート6社、表彰式は東京ビッグサイト"
