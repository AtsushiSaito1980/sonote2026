    text: "餌代の高騰と、高水温による斃死の増加で、多くの養殖業者が赤字になっている"
    confirmed_by: [S3]
    verify: partial
    note: "TW5（人口動態・環境）の実体。**気候の是非は論評しない**（地形として扱う）"
