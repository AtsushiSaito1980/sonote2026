notes: |
  ・**数字の系統は5つ。台本では4つに絞る**（density: balanced の上限が数字5個のため）：
    ①品揃え（F05 4,000種と100種／F04 5種で9割以上）②生き物の時間（F13 3〜5年と1年）
    ③出荷（F18 ことしの春に8,000尾）④技術の年月（F12 2007年の起点）
    ⑤知られ方（rejected の自社調査）→ 記事のみ
  ・**固有名詞は6つまで**：さかなドリーム／夢あじ／カイワリ／金アジ／東京海洋大学／豊洲市場。
    クロマグロ・サバ・マアジ・ニジマス・ヤマメは魚の一般名として扱う（review.md に数え方を書く）
  ・**時期の明示**（§4）：受賞＝今週／出荷＝ことしの春／調達＝去年の秋／技術の起点＝二十年近く前／
    動機の言葉＝おととしの取材
  ・**partial が多い回。**F03・F04・F05・F06・F07・F09・F10・F13・F14 は会社側の説明か
