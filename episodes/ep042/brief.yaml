hook: "まず、魚屋さんの店先の話をさせてください。日本の海には、四千種を超える魚がいるそうなんです。で、店に並ぶのは、百種類もない。"
lesson_draft: "天然にいない魚を作って、値段を自分で決める"
homework_draft: "自社の商品が、何かの『代替』として売られていないか。代替のままだと、値段は比べられる相手のほうが決める。比べる相手がいない一点を作るとしたら、どこを変えるか"
