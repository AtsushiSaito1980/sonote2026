notes: |
  ・**巡回で選んだ回。**候補6件（さかなドリーム／ファミマ×ブックオフ／menu終了／Planet Savers／
    ソフト2万社／BionicM）から、面白さ109・応用100で選定。残り5件は backlog へ戻す
  ・**咀嚼の3拍**（思い込み→訂正→自分の言葉で言い直す）：
    ①珍しい魚を養殖する話だと思っていた → **親を入れ替える話だった。**
      育てにくい魚を、育てやすい魚に産ませる（成熟まで3〜5年のクロマグロを、1年で成熟するサバに）
    ②天然に近づける品種改良だと思っていた → **天然にいない魚を作っていた。**
      しかも品種改良の目的が、速く安く育てるから「旨い」へ入れ替わっている
    ③技術がすごいから儲かるのだと思っていた → **売り先を自分で持ったから儲かる。**
      種苗を売る形をとらず、育った魚を全量買い取って自社ブランドで売る＝**値段を自分で決める側に回る**
  ・**この回の芯は③。**業界の負のスパイラルは、5種で9割という品揃えの薄さ →
    差別化が無い → 単価を自分で決められない → 増産 → 供給過多 → 相場下落 → 赤字。
    技術は入口で、出口は「比べられない一点を持って、売り先まで自分で握る」こと
  ・**数字の系統（台本は4つに絞る／⑤は読み上げ版と記事へ回す）**：
    ①品揃え（4,000種と100種／海面養殖は5種で9割以上）②生き物の時間（3〜5年と1年）
    ③出荷（ことし3〜4月に8,000尾）④技術の年月（2007年の最初の発表から、ことし8月の受賞まで）
    ⑤知られ方（首都圏高級魚ユーザーの認知率20%超・喫食意向約60%＝自社調査・1系統）
  ・**固有名詞は6つまで**：さかなドリーム／夢あじ／カイワリ／金アジ／東京海洋大学／豊洲市場。
    クロマグロ・サバ・マアジ・ニジマス・ヤマメは魚の一般名として扱い、review.md に数え方を書く
  ・**個人名は出さない**（§3）。「この技術を作った、大学の研究者」「会社を立ち上げた人」。
    大学名・役職名は可。**投資家名・支援企業名は台本で使わない**
  ・『』は2回まで：動機の言葉（「天然信仰をひっくり返せるような……」）と、
    会社が自社を説明する言い方（「一代限りの養殖魚」）
  ・**言い切ってはいけないこと**：「サバがマグロを産む」は**まだ実現していない。**
    成功しているのはニジマスをヤマメに、トラフグをクサフグに産ませるところまで。
    構想として、時期を添えて語る（2007年の発表に「可能か？」と書かれている、という形）
  ・**値踏みの禁止**：天然信仰を「間違い」と断じない。消費者の好みではなく、
    **物差しがひとつしかなかったこと**を扱う。他の養殖ブランドとの比較もしない（§2-6）
  ・**使わないもの**：夢あじの価格（どの一次にも無い。取れていないことを台本で言う）／
    生産コスト・売上高・従業員数（非公表）／「マアジの1.5倍の速さで育つ」（二次のみ・1系統）／
    投資家名／競合比較
  ・時期の明示（§4）：受賞は「今週」、本格販売は「ことしの春」、資金調達は「去年の秋」、
    技術の最初の発表は「二十年近く前」
  ・**ep031（仕入れ値をマイナスにする）との書き分け**：あちらは仕入れ側の反転、
    この回は**売り値を誰が決めるかの反転**。台本内で過去回に言及しない
  ・**裏取りの弱点（人間確認をお願いしたい箇所）**：
    ①クロマグロ3〜5年／サバ1年 は S6 のインタビュー1系統
    ②認知率20%超・喫食意向約60% は CEO note の自社調査1系統（台本では使わず記事のみ）
