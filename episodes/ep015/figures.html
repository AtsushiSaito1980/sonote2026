<!-- ep015 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<div class="cover-wrap">
<figure class="fig cover" data-fig="cover">
  <div>
    <div class="fig-kicker">その手があったか</div>
    <div class="cv-lesson">止まる日を、先に描く。</div>
    <div class="cv-title">飲食店の売上を「週2回、先に払う」と言った会社の、負債1,151億円</div>
  </div>
  <div>
    <div class="cv-stat"><span class="cv-n">1,151<small>億円</small></span><span class="cv-cap">今年最大の倒産。7月の全国倒産の負債総額の約半分を1社で占めた</span></div>
    <div class="fig-foot"><b>その手があったか</b><span>なんで、それで儲かるんですか？</span></div>
  </div>
</figure>
</div>

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">小口を束ねて時間を売る——褒められる型と同じ構造の中に、急所が最初から埋まっていた。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 9v3a6 6 0 0 0 12 0V9"/><path d="M12 7v5"/></svg>
      <div class="ct">20万店を束ねる</div>
      <div class="cd">小口の飲食店のカード売上を集約</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div class="ct">時間を縮めて売る</div>
      <div class="cd">数週間の入金待ちを「週2回」に。原資は借入</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      <div class="ct">伸びるほど現金が要る</div>
      <div class="cd">川上が細り調達が締まった日、回転が止まった</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：帝国データバンク 倒産集計7月報（2026年8月10日）ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="7月の倒産負債総額の約半分を全東信1社が占めたことを示す円グラフ">
        <circle class="rest" cx="75" cy="75" r="60"/>
        <path class="wedge" d="M75,75 L75,15 A60,60 0 0 1 75,135 Z"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">約半分</div>
      <div class="fl">7月の全国倒産1,037件・負債総額2,341億円のうち、<strong>約半分は全東信1社</strong>。2ヶ月連続の1,000件超えは約17年ぶりだった。</div>
      <div class="fs">帝国データバンク「倒産集計 2026年7月報」（2026年8月10日公表）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>倒産統計は、商売の急所の一覧表として読める</span></div>
</figure>
