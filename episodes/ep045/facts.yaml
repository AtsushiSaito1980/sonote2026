    verify: partial
    note: "工場の面積は記事ごとに言い方が違う（テニスコート数面分→サッカー場くらい→2.2万㎡）。
      **台本では面積を言わない。**マンハッタンから車で約15分（S9・本人談）は場面づくりに使ってよい"
  - id: F03
    text: "2018年に看板品種を1パック約50ドルで発売し、ニューヨークのミシュラン星付きレストランから評判が広がった。販売先は2022年にホールフーズへ広がり、現在は米国18州とカナダ1州、300を超える小売店"
    confirmed_by: [S5, S14, S10, S4, S6, S3]
    verify: verified
    note: "**数字①：五十ドル（八年前）。**発売時の粒数は6粒（S8）／8〜11粒（S15）／1粒5ドル（S12）と食い違うので、
      **台本では粒数を言わない。**「一パック、五十ドル」で置く。**円換算しない**（記事側の換算が3通りある）"
  - id: F04
    text: "値段は、2023年8月に1パック9.99ドル、2025年4月に7.99ドルまで下がった。2026年4月の新しい品揃えでは、最も安いもので3オンス4.99ドル、看板品種は4.2オンス11.99ドル"
    confirmed_by: [S4, S6, S17, S9, S15]
    verify: verified
    note: "**数字②：七ドル九十九セント（去年の四月）。**会社の沿革（S4）と自社リリース（S6）が一次。
      2026年の4.99ドル・11.99ドルは容量が違うので**台本では使わない**（同じ物差しで比べられない）。読み上げ版と記事で使う。
      本人は数年以内に1パック数百円に到達すると話している（S17）が、どの市場の価格か不明なので不使用"

  # --- この回の芯（Q1・順番） ---
  - id: F05
    text: "本人は、これだけ大きな産業を作り直す場合、初日から既存の農業とコストで並ぶのはほぼ不可能で、数十年かかると話している。だから、高い値段をとれる作物で先に利益の出る事業を作り、裏でコストを下げる戦略にした"
    confirmed_by: [S14, S9]
    verify: partial
    note: "**この回の芯。**本人談（S14 は英語の直接引用あり）。30〜40年の長期では植物工場は露地より安くなると見ている（S9）。
      **台本では本人の考えとして伝聞形で置く**"
  - id: F06
    text: "本人は、自社の看板品種を、テスラが最初に出した高価なスポーツカー（ロードスター）にたとえ、より低コストで作れる品種を後に続く量産車にあたるものとして準備していると2021年に話している。テスラはポルシェより速いEVという圧倒的な製品でブランドを築いた、とも語る"
    confirmed_by: [S13, S10]
    verify: partial
    note: "**OP13（翻訳する）の根拠。**自動車の売り方を農業へ持ち込んでいるのは**本人の言い方**。
      その後、2023年に Koyo、2025年に Nikko を投入（S6）＝実際に下の価格帯の品種が続いた"
  - id: F07
    text: "本人によると、最大の費用は人件費で、品種により生産コストの30〜50%。手作業の受粉では採算が合わず、受粉の成功率は30%や60%では足りず、90%以上が必要"
    confirmed_by: [S14, S12]
    verify: partial
    note: "**数字③：九割（採算に要る受粉の成功率）。**本人談2系統（2023年・S14）。
      会社の沿革に2020年に95%を達成とある（S4）が、台本は「九割を超えないと商売にならない」の形で置く。
      人件費3〜5割は台本で使わない（数字の上限）"
  - id: F08
    text: "植物工場の中ではハチは飛ばないのが常識とされていた。人工照明の下ではハチが動きにくく、これが植物工場で花の咲く作物が進まなかった大きな理由の一つだと本人は話す。屋外にいると錯覚させる環境を作ったが、詳細は明かしていない"
    confirmed_by: [S9, S12, S13, S11]
    verify: partial
    note: "**咀嚼③の材料。**技術の中身は非公開。台本で推測を足さない"
