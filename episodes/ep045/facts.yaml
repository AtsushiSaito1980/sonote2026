    text: "イチゴを選んだ理由を本人は、付加価値が高くキャッシュフローが強いこと、同時に最も難しい作物の一つで、攻略できればトマトやメロンなど実のなる作物に広げられることだと話す。『最初からイチゴしか眼中になかった』とも"
    confirmed_by: [S12, S11, S13, S10]
    verify: partial
    note: "**咀嚼②の材料。**『』②。日本人だから選んだのではない、という本人の発言（S11：要素技術が全部そろう国が日本だけ、自分が日本人だから選んだのではない）も添えられる"

