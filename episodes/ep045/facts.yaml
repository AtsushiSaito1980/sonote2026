    note: "**アンカー（30日前・窓の最終日）。**農水省・経産省の同日発表。
      『世界で初めて』は**農水省の受賞理由の言い方**なので、台本では「国の発表では」の形で置く。
      内閣総理大臣賞（Mujin）など他の受賞者には触れない"

  # --- 商売の輪郭 ---
  - id: F02
    text: "米国ニュージャージー州の完全閉鎖型の植物工場で、ハチに受粉させてイチゴを通年栽培している。光・温度・湿度・二酸化炭素などを制御し、ロボットが収穫する。2024年6月に大型の工場が稼働した"
