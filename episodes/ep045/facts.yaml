  # --- アンカー ---
  - id: F01
    text: "日本スタートアップ大賞2026で、Oishii Farm が農林水産大臣賞（農業スタートアップ賞）を受賞。発表と表彰式は2026年9月25日。応募317件から10社が受賞。受賞理由は、量産が難しいとされてきた植物工場で、世界で初めていちごの安定量産とビジネスモデル化を実現したこと"
