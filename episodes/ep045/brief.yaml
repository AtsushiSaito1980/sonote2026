notes: |
  ・**窓の最終日に作る回。**アンカーは9/25（30日前）。台本では「先月の終わり」と時期を明示する。
    日本での販売開始が発表されたら、それが次の節目（T3定点観測の候補）
  ・**この回の芯は「順番」。**植物工場は、初日から露地とコストで並ぶのはほぼ不可能（本人談・S14）。
    日本の植物工場は葉物でそれをやろうとして、ほとんどが潰れた（本人談・S9/S12）。
    彼は逆の順番を取った：**まず一番高く売れる一粒で利益を出し、量を作りながら値段を下げる。**
    五十ドル（二〇一八年）→ 七ドル九十九セント（去年の四月）。これが自動車の売り方の持ち込み（OP13）
  ・**咀嚼の3拍**：
    ①植物工場の野菜は、安くするためのものだと思っていた → **最初の一粒は、五十ドルだった。**
      安く作れるようになる前に、高く売れるもので食べていく
    ②イチゴを選んだのは、日本人だから・日本の果物だからだと思っていた → **一番難しいから選んだ。**
      受粉が要る作物は屋内では作れないと言われていた。できれば、ほかの実のなる作物にも広げられる
    ③工場で作れば、ハチなんか要らなくなると思っていた → **逆で、ハチの機嫌が採算を決める。**
      受粉が九割を超えないと、商売にならない（本人談）
  ・**数字は3つ**（narrative）：①五十ドル（発売時の1パック）②七ドル九十九セント（値下げ後）③九割（採算に要る受粉の成功率）
    ※ 2026年4月の4.99ドル・人件費3〜5割・累計3億7,000万ドル・従業員305人・ミシュラン2割は**台本で使わない**
      （数字の上限）。読み上げ版と記事に回す
    ※ **通貨は原通貨のまま。円換算しない**（記事側の換算が3通り＝5,000円／7,500円／7,900円で食い違う）
  ・**固有名詞は4つまで**：オイシイファーム／テスラ／ニューヨーク／アメリカ。
    ※ 品種名・ホールフーズ・バークレー・デロイト・羽村・SPARX は台本で使わない（説明語に置く）
  ・**個人名は出さない**（§3）。「この会社を作った人」。記事では実名（古賀大貴氏）を書く
  ・『』は2回まで：「どう考えても日本とまったく同じことが起こる」（S9・本人談）／
    「最初からイチゴしか眼中になかった」（S10・本人談）
  ・**倫理線**：
    - **日本の植物工場の撤退を「失敗」と値踏みしない**（§2-6）。本人の言葉「儲からなかった」「潰れた」の範囲に留め、
      社名（パナソニック・シャープ・東芝）は台本でも記事でも出さない
    - 米国の他社の破産・人員削減も社名を出さない（記事でも「業界では」で置く）
    - 国産イチゴの生産者と対立させない。会社自身が「奪うのではなく足りない時期を補う」と説明している（S16）
  ・**言い切ってはいけないこと**：
    - **会社全体が黒字かどうかは分からない。**会社は売上と黒字化までの距離の開示を断っている（S15）。
      本人が言っているのは「施設ごとに正のキャッシュフロー」（S12・2023年）まで
    - 日本での販売価格・販路・数量は未定（S18）
    - 受粉の最新の成功率（2020年に95%とする会社の沿革があるが、九割以上が採算の条件、という言い方で使う）
  ・**創業年は2016年と2017年の両方の記載がある**（法人設立2016年12月／工場の竣工と事業開始2017年）。
    台本では年を言わず「留学中に会社を作った」で置く。記事では「2016年に設立し、2017年から生産を始めた」と分けて書く
  ・時期の明示（§4）：受賞＝先月の終わり／発売の五十ドル＝八年前／七ドル九十九セント＝去年の四月／
    日本での販売決定＝八月
  ・**ep042 との書き分け**（3本前・同じ食べ物で「値段を自分で決める」話）：
    ep042 は「天然と比べられない土俵に降りる」。この回は「値段を上から下へ動かしていく順番」。
    **「天然」「比べられない」の語を主軸に使わない。台本で ep042 に言及しない**
  ・**ep044 との書き分け**（直前・時間のずらし）：ep044 は工場を建てる時期とルールの時間差。
    この回は値段と原価の順番。「ずらす」の語を手の名前に使わない
