facts:
  # --- アンカー ---
  - id: F01
    text: "イシダメディカルの排尿計測記録システムが、第10回ものづくり日本大賞の優秀賞を受賞。優秀賞は22件111名で、うち近畿ブロックは3件12名。受賞決定の報道発表は2026年3月5日、近畿経済産業局の紹介記事は7月6日に公開され、8月20日に業界メディアへ転載された"
    confirmed_by: [S1, S2]
    verify: verified
    note: "**アンカーは8月20日の転載（窓内）。**元記事は7/6、受賞は3/5で窓外なので、
      台本では「ことしの三月に受賞」と時期を明示する（§4）"

  # --- 現場（動機の場面） ---
  - id: F02
    text: "立ち上げ当初、知り合いの医師に勧められて医療現場を見学した。手術中、看護師が15分に1回、30分に1回、尿バッグを見て、何時何分・何ミリリットルと記録していた。出血量も手作業で計測していた"
    confirmed_by: [S1]
    verify: verified
    note: "**MO4「見てしまった」の場面。**代表の言葉として記事に引用されている。
      **個人名は台本に出さない**（§3）。「立ち上げた人」で置く"
  - id: F03
    text: "代表は当時の受け止めを『ものすごく大切でありながらもアナログな作業が、今も医療現場に残っているんです』という趣旨で語っている"
    confirmed_by: [S1]
    verify: verified
    note: "『』①。逐語ではなく趣旨の再現であることを記事に明記する"
  - id: F04
    text: "尿量を測るためにバッグを開けると、液体が出る代わりに空気が入る。そこから菌が入って尿路感染につながるリスクがある、と代表は説明している"
    confirmed_by: [S1]
    verify: verified
    note: "**この回の芯。**測るという行為そのものが感染の入口になっていた。
      手間の話と患者側のリスクの話が、ここで一本につながる"

  # --- 装置 ---
  - id: F05
    text: "ウロチェッカー（URC-001）は一般医療機器・特定保守管理医療機器。届出番号26B2X10037000001、一般的名称は「再使用可能な尿流量計」。ウロバッグを歪みゲージ式ロードセルに吊り下げ、重さで量る"
    confirmed_by: [S3]
    verify: verified
    note: "PMDAの添付文書情報で確認。**方式は「吊るして重さ」だけ**——ここが海外勢との違い"
  - id: F06
    text: "計測精度は±2g以下（機械精度）、計測範囲0〜3,000g、最小表示1mL。計測間隔は1分から12時間まで選べる。血尿を見る後付けモジュール（ヘマトチェックモジュール）と、院内サーバで動く記録ソフト（ウロロガー）と合わせて3点構成"
    confirmed_by: [S4]
    verify: verified
    note: "台本では最小1mLだけ使う（系統の節約）。スペックの全文は inbox の .md にある"
  - id: F07
    text: "公式サイトは『専用の消耗品は無く、さまざまなメーカーのウロバッグを使用することができます』と特長に挙げ、あわせて「精密尿量計付きウロバッグをより安価な汎用ウロバッグに変更できます」「排尿計測の際の感染防御のための消耗品の費用を削減します」とコスト削減を説明している"
    confirmed_by: [S4]
    verify: verified
    note: "『』②。**装置代の原資がその差額なのかは、どこにも書かれていない。**
      台本でも記事でも、そこは推測として扱い、断定しない"

  # --- 会社 ---
  - id: F08
    text: "株式会社イシダは1893年創業。日本で最初の度量衡免許を受けてハカリの製造を始めた京都の計量機器メーカーで、世界100カ国以上で事業を行う。2015年から医療・医薬分野へ展開し、2020年4月にイシダメディカル株式会社と米国法人を設立、2022年に排尿計測記録システムの販売を日米で開始した"
    confirmed_by: [S5]
    verify: partial
    note: "創業年・100カ国はイシダ公式。**売上高・従業員数・世界シェア70%は英語版Wikipediaのみで
      一次未確認のため使わない**（inbox の .md に記載のとおり）"
  - id: F09
    text: "米国法人を同時に置いた理由として、米国は看護師の人件費が高く省力化への投資が受け入れられやすいこと、外科手術の件数が多いことを挙げている"
    confirmed_by: [S1]
    verify: verified
    note: "TW5（人手）の裏づけ。**米国での規制上の扱いは未確認**（FDAの510(k)で見つけられなかった）"
  - id: F10
    text: "製造・販売・品質でパートナー3社（台湾・日本・米国）と組む体制をとっている。代表は『どことパートナーを組んで一緒に進めるかという座組がとても大事です』という趣旨を述べている"
    confirmed_by: [S1, S4]
    verify: partial
    note: "**どの会社が何を担当しているかは明記されていない。**台本では役割を特定しない"

  - id: F13
    text: "本社側の社長が医療従事者へのリスペクトを強く持っており、グループの技術を食品分野だけにとどめたくないという思いがあった、と記事で紹介されている"
    confirmed_by: [S1]
    verify: verified
    note: "**動機の二重構造。**現場を見た人の動機と、本社側の思いが両方ある。
      個人名は出さず「本社の側にも」と置く"
  - id: F14
    text: "装置は、充満・多尿・乏尿・計測再開忘れ・計測忘れ・尿中ヘモグロビンの高低を通知する。バッテリーで最大36時間の連続計測ができ、記録は院内に置くサーバのソフトに集める"
    confirmed_by: [S4]
    verify: verified
    note: "読み上げ版のみ。**通知の一覧が、そのまま「人が見落とす項目の一覧」になっている**"
  - id: F15
    text: "ものづくり日本大賞は平成17年から、経済産業省・国土交通省・厚生労働省・文部科学省の連携で行われており、今回が10回目にあたる"
    confirmed_by: [S2]
    verify: verified
    note: "読み上げ版のみ。賞の位置づけ"

  # --- バッグの差額（追加調査：2026-08-29） ---
  - id: F16
    text: "同じ通販サイトの税込表示（2026年8月時点）で、あるメーカーの精密尿量計付きウロバッグは5枚入7,920円＝1枚1,584円、同じメーカーの汎用採尿バッグは10枚6,260円＝1枚626円。差額は1枚あたり958円。他メーカーの汎用品も並べると370〜1,011円で、差額はおおむね570〜1,200円の幅に入る"
    confirmed_by: [S8]
    verify: partial
    note: "**これは通販の店頭価格であって、病院の仕入れ値ではない。**病院は商社経由でこれより安く
      買っているはずなので、絶対額は縮む可能性が高い。台本では『およそ千円』の水準に丸めて言う。
      **メーカー名は台本に出さない**（比較に見えるのを避ける）"
  - id: F17
    text: "CDCのカテーテル関連尿路感染防止ガイドライン（2009）も国内の各種マニュアルも、カテーテルと採尿バッグの定期交換は推奨していない。交換するのは閉塞・著しい混濁・閉鎖系の破綻が起きたときだけ"
    confirmed_by: [S9]
    verify: verified
    note: "**この回のいちばん効く事実。**定期交換しない＝バッグは実質、患者1人に1個。
      入院日数を掛け算できないので、浮くのは1患者あたり約1,000円で頭打ちになる"
  - id: F18
    text: "公式サイトのコスト削減の説明は2本立てで、1本目が「精密尿量計付きウロバッグをより安価な汎用ウロバッグに変更できます」、2本目が「排尿計測の際の感染防御のための消耗品の費用を削減します」"
    confirmed_by: [S4]
    verify: verified
    note: "**バッグを開けて捨てる行為は1日に何度もある。**そのたびに要る手袋・エプロン・消毒が
      浮くとすれば、2本目のほうが効く可能性がある。**回数も単価も公開されていないので、
      台本では『たぶんこちらのほうが効く』と推測であることを明示して言う"
  - id: F19
    text: "2019年9月の取材記事では、このシステムは「ウロレコ」という名称で紹介されており、代表の肩書きは「株式会社イシダ 医療事業企画室長」だった。子会社を作る前は、本体の社内組織として動いていたことになる"
    confirmed_by: [S10]
    verify: verified
    note: "**新規事業担当に効く事実。**社内の企画室 → 子会社（2020年）→ 米国法人を同時に置く、
      という順番が見える。読み上げ版で使う"

  # --- 競合・市場 ---
  - id: F11
    text: "2026年2月26日、別の大手電機メーカーが同方式の尿監視支援システムを発表し、同年3月から販売を開始した。「今お使いのウロバッグを吊るすだけで導入できる」「精密尿量計付きバッグから汎用ウロバッグへの代替が期待され、消耗品コストの削減」と、方式も売り口上もほぼ同じ"
    confirmed_by: [S6]
    verify: verified
    note: "**日米での販売開始（2022年）から約4年後。**型が広がり始めた証拠として使う。
      **社名は台本に出さない**（値踏みに聞こえるのを避ける）"
  - id: F12
    text: "海外勢は作りが違う。カテーテルやドレインラインの側を作り替えて能動的に測る方式で、専用の使い捨てが必要になる。腹腔内圧や深部体温も同時に測るものもある"
    confirmed_by: [S7]
    verify: partial
    note: "**製品名・企業名は台本に出さない**（固有名詞の節約）。記事では書いてよい。
      AKIの死亡者数などの臨床数値は企業リリースと論文の二次記述なので使わない"

