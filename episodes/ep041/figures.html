  <p class="fig-lead">測るために袋を開けると、出た分だけ空気が入る。測る行為そのものが感染の入口だった——だから工程ごと引いて、外から重さを量る。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M6 8h12l-1.5 12H7.5L6 8Z"/><path d="M9 13h6"/></svg>
      <div class="ct">開けて、目盛りを読む</div>
      <div class="cd">15分おき・30分おきに手で記録。開けると空気が入る</div>
    </div>
    <div class="cop">→</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M4 7h16"/><path d="M8 7l-3 7a3 3 0 0 0 6 0L8 7Z"/><path d="M16 7l-3 7a3 3 0 0 0 6 0L16 7Z"/></svg>
      <div class="ct">吊るして、重さを量る</div>
      <div class="cd">歪みゲージ式ロードセル。最小表示1mL、1分〜12時間で設定</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>

      <div class="cd">どのメーカーの袋でも使える。高い計量付き袋を汎用品へ</div>
    </div>
