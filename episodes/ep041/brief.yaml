    装置価格・導入病院数（一切取れていない）。AKIの死亡者数（企業リリースと論文の二次記述）。
    診療報酬の加算（別製品に効く側で、この装置に付くかは未確認）。
    **バッグのメーカー名**（比較広告に見えるので台本では出さない。記事では可）
