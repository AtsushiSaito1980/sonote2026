notes: |
  ・**巡回の外で拾ったネタから作る最初の回。**inbox/2026-08-29-ishida-medical.md →
    bl032 → ep041。手の見立てはチャット側の仮（OP13）から OP01 へ、こちらで確定した
  ・**当初 ep038 として組んだが、main に ep038〜040 が先にあったため ep041 へ振り直した。**
    あわせてホストを三崎から戸倉へ変更（ep040 が三崎で、連続を作らないため）。
    材料はどちらにも合うが、戸倉の稟議・予算の視点で解剖三を立てるほうが芯に近い
  ・**咀嚼の3拍**（追加調査で3拍目が深くなった）：
    ①測り方を良くする話だと思っていた → **開けない話だった**（測るために開けると空気が入り、
      感染のリスクになる）②医療機器は本体を安くして消耗品で回収すると思っていた →
      **専用の消耗品を作らないことを売り文句にしていた** ③その差額に入院日数を掛けるのだと
      思っていた → **バッグは定期交換しない。患者1人に1個で、浮くのは約1,000円で打ち止め**
  ・**この回の芯が一段深くなった。**売り文句は2本立て（①高いバッグ→安いバッグ ②感染防護の
    消耗品）で、**効き目が大きいのはおそらく2本目**。並び順と効き目の順が同じとは限らない。
    ただし回数も単価も非公表なので、**推測であることを台本で明示する**
  ・**回収年数の試算は台本にも記事にも出さない。**出典が無い（facts の rejected）。
    「装置の値段が出ていないので計算できない」までにする
  ・数字は5系統：①会社の年月（1893年創業／2020年に子会社／2022年に日米で販売）
    ②現場の作業（15分に1回・30分に1回）**③バッグの価格（1,584円／626円／差額約1,000円）**
    ④受賞（第10回ものづくり日本大賞 優秀賞・ことし3月）⑤競合（4年後に別の大手が同方式）
    ※装置スペック（最小1mL等）は系統を空けるため台本から落とし、読み上げ版でのみ使う
  ・**固有名詞は3つまで**：イシダ／ウロチェッカー／ものづくり日本大賞。
    **競合は社名を出さない**（「別の大手電機メーカー」）。値踏みに聞こえるのを避ける
  ・『』2回：現場を見たときの言葉／公式サイトの「専用の消耗品は無く」
  ・**個人名は出さない**（§3）。「立ち上げた人」「代表を務める人」。役職名は可
