notes: |
  ・キー数字は有価証券届出書ベース（IPOナビ転載）＋会社リリース。届出書原本（EDINET）での再確認を人間裏取り事項とする。
  ・不使用と決めた数字：FY2026通期会社予想（ソース間不一致）／2019年6月期純損失24億円・8割ダウンラウンド（単独ソース）／
    累計調達100億円・元本割れ（SNS経由）。台本・記事とも使わない。
  ・時期明示が必要な事実：retail HUB開始（2023年9月）、万代全167店舗（2024年1月時点）、サイネージ累計11,000台（2024年11月時点）、
    購買の95.5%が店頭（2025年8月公表の調査）。
  ・個人名は台本に出さない（憲法§3）。創業者は「携帯ゲームを立ち上げてきた人」で扱う。
  ・クラシル・クックパッド・万代・DELISH KITCHENの固有名詞は事実カード対応の範囲で使用可。ただし固有名詞の系統数上限に注意し、
    台本ではクックパッドを落とす選択肢を優先。
  ・「リテールメディア」はカタカナの業界用語。台本では多用せず「売場をメディアにする」等の言い換えを基本にする（憲法§2-4の趣旨）。
  ・ep007と「タダで配って別で稼ぐ」構図が似て見える点に注意。今回の芯は無料配布ではなく、
    「ネット広告の当たり前（狙って出す・効いたか測る）を、効果を測ってこなかった店頭販促の世界に持ち込んだ」こと。
