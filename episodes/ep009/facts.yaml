  ・固有名詞は6系統以内。使用：エブリー／デリッシュキッチン／万代／クラシル／東証グロース（＋スーパー・食品メーカー等の一般名詞）
    不使用（一般名詞化）：KDDI・伊藤忠食品・加藤産業・旭食品→「通信の大手」「食品の卸の大手」、グリー→「携帯ゲームの会社」、
    retail HUB→「小売向けの仕組み」、KALOS・MAMADAYS・TIMELINE・クックパッド→出さない
