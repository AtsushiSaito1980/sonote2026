  ・台本の数字は5系統以内（標準回balanced：数字5・固有名詞6・例え話2）。系統案：
    ①時期（十一年前・三年前・おととし・今年三月まで・今月四日）②店頭比率（95.5%）
    ③売場の網（1万1000台・167店舗）④利用規模（3100万人）⑤損益の転換（▲13.7億→＋3.2億）
