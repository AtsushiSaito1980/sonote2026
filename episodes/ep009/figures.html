<!-- ep009 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">ネット広告では当たり前の作法を、まだ効果を測っていなかった売場へ持ち込んだ。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      <div class="ct">ネット広告の作法</div>
      <div class="cd">狙って出す・効いたか測る</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
      <div class="ct">測っていなかった売場</div>
      <div class="cd">チラシ・店頭POP・試食販売</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 10.5 10 8l2.5 3L17 7"/></svg>
      <div class="ct">売場が、広告の媒体になる</div>
      <div class="cd">流した動画と売れた数が、突き合う</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：有価証券届出書（2026年6月30日提出）ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="食品の購買の95.5%が店頭で起きていることを示すドーナツ図">
        <circle class="track" cx="75" cy="75" r="60"/>
        <circle class="arc" cx="75" cy="75" r="60" stroke-dasharray="360 377" stroke-dashoffset="0"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">95.5<small>%</small></div>
      <div class="fl">食品・飲料・酒類は、いまも <strong>95.5%が店の棚の前</strong>で買われている。ネットで買われるのは4.5%しかない。</div>
      <div class="fs">経済産業省「令和6年度電子商取引に関する市場調査」（2025年8月公表）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>スマホに広告費を払っても、財布が開くのは売場だった</span></div>
</figure>
