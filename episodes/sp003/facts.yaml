# **放送前に人間が裏取りすること。**とくに「単独出典の1件」と「規模の数字」の2点。

episode_id: sp003
extracted_on: 2026-08-15

facts:
  # --- アンカー（8/6 集英社の多言語配信） ---
  - id: F01
    text: "2026年8月6日、集英社がマンガの多言語配信サービス『MANGA MILLION（マンガミリオン）』を公開。約400作品・100万ページ規模を、100を超える言語で配信する"
    confirmed_by: [S1a, S1b]
    verify: partial
    note: "アンカー。**「約400作品・100万ページ・100超の言語」は公式一次資料で要裏取り。**
      台本は「約四百作品。百万ページ。百を超える言語に、翻訳して出す」と平叙で言い、
      作品ごとの数だけ「九十六の言語だそうです」と伝聞に落としてある"
  - id: F02
    text: "看板作品の1つは96言語で提供される"
    confirmed_by: [S1b]
    verify: partial
    note: "**作品名は台本に出さない**（作品の宣伝に見えないように「ある看板作品」と言い換え）。数字だけ使う"
  - id: F03
    text: "翻訳は生成AIを使わず、すべて人の手による"
    confirmed_by: [S1a, S1b]
    verify: partial
    note: "**ここを落とすと『AIで安くなったから成立した』という別の話になる。**
      台本では最後に「今回の翻訳は、生成エーアイを使わず、すべて人の手だそうです」と伝聞で置いた"
  - id: F04
    text: "言語圏の小さい国では公式の翻訳が出ておらず、商売にならないとされてきた。出ていない地域では別の経路で読まれていた"
    confirmed_by: [S1b]
    verify: partial
    note: "**回の芯。取り締まりや善悪の話にしない**（brief の申し送り・憲法§2-6）。
      需要が先にあって値札と流通が無かった、という構造だけを扱う。読んでいた人を責める書き方はしない"

  # --- 日本特殊陶業（自社工場を一人目の客にする） ---
  - id: F05
    text: "2026年8月5日、日本特殊陶業が岐阜県の自社工場の一角にエネルギー実証施設を新設。燃料電池・太陽光・蓄電池を組み合わせた工場のエネルギー管理を実証する"
    confirmed_by: [S2]
    verify: partial
    note: "**この回で唯一の単独出典。放送前に施設の中身と開始時期を一次で確認すること。**
      施設の正式名称は耳に残らないので台本では使わず「実証の施設」と言っている（記事では正式名称を書いてよい）"
  - id: F06
    text: "同社の主力であるスパークプラグは内燃機関の部品で、電気自動車には使われない"
    confirmed_by: [S2]
    verify: verified
    note: "業界の常識にあたる部分。**「本業が縮む」までは事実、「縮む前に次を試している」は構造の読み。**
      値踏みの語（失速・迷走など）は使わない（憲法§2-6）"

  # --- ナレッジワーク×リコージャパン（他社の営業網に乗る） ---
  - id: F07
    text: "2026年8月4日、営業支援ソフトのナレッジワークが35億円を調達し、リコージャパンと資本業務提携を発表"
    confirmed_by: [S3a, S3b, S3c]
    verify: verified
    note: "**この回でいちばん堅い。**日経・PR TIMES・マイナビの3系統で一致"
  - id: F08
    text: "狙いは全国の中堅・中小企業。リコージャパンが複合機で持つ顧客基盤を販路にする。計画では2030年度までに3,000社への導入を目指す"
    confirmed_by: [S3a, S3b]
    verify: partial
    note: "**3,000社は計画値。**台本も「計画では、二〇三〇年度までに、三千社」と、計画であることを言ってから数字を出している"
  - id: F09
    text: "開発はナレッジワーク側が持ち、販売網はリコージャパン側が担う分担になっている"
    confirmed_by: [S3a, S3c]
    verify: partial
    note: "「作る力は自分で持ったまま、届ける足だけを借りる」という言い方の根拠。
      **貸す側の利（複合機だけの関係に売るものが増える）は構造の読みで、発表に書かれた文言ではない**"

