notes: |
  ・**並べる順番が本体**：内側（自社工場）→ 借りる（他社の営業網）→ もういる（無料で読んでいた人）。
    だんだん「探していない度合い」が強くなり、3本目で「需要はとっくに証明されていた」に着地する
  ・**海賊版の扱い（棚の申し送りどおり）**：取り締まりや善悪の話にしない。**未充足需要という構造だけで扱う。**
    読んでいた人を責める書き方はしない（憲法§2-6）
  ・**人間の裏取りが必要**：
    - 日本特殊陶業は**レスポンスの単独出典**。施設の中身と開始時期を一次で確認
    - 集英社の「約400作品・100万ページ・100超の言語・96言語」は**公式一次資料で要裏取り**（棚のnote）。
      台本は「だそうです」で伝聞に留めてある
    - ナレッジワークの35億円・3,000社は日経＋PR TIMES＋マイナビの複数系統。この回でいちばん堅い
  ・数字は3系統：①調達と目標（三十五億円・二〇三〇年度・三千社）②規模（四百作品・百万ページ・百超の言語・九十六言語）
    ③日付（八月四日・五日・六日）
  ・固有名詞：日本特殊陶業／ナレッジワーク／リコージャパン／集英社／マンガミリオン の5つ。
    N-Terraceという施設名は耳に残らないので台本では使わず「実証の施設」と言う（記事では正式名称可）。
    作品名も出さず「ある看板作品」と言い換え（作品の宣伝に見えないように）
  ・『』1回：『マンガミリオン』（配信の名前）
  ・**制作情報を一切出さない**：この回がどう組まれたかには触れない（憲法§2-13）
