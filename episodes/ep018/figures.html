<!-- ep018 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<div class="cover-wrap">
<figure class="fig cover" data-fig="cover">
  <div>
    <div class="fig-kicker">その手があったか</div>
    <div class="cv-lesson">伸びた金額を、単価と数量に割る。</div>
    <div class="cv-title">米の輸出、量は13.7%減って金額は11.6%増えた——単価3割高の計算になる</div>
  </div>
  <div>
    <div class="cv-stat"><span class="cv-n">+83.5<small>%</small></span><span class="cv-cap">輸出の伸び頭は意外にも緑茶（482億円）。二番手はブリ+69.0%</span></div>
    <div class="fig-foot"><b>その手があったか</b><span>なんで、それで儲かるんですか？</span></div>
  </div>
</figure>
</div>

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">合計8,977億円は平均の顔。単価と数量に割ると、「高く買う場所へ運んだ品目」だけが伸びていた。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M4 19h16M4 19V5"/><path d="M7 19v-7h3v7m3 0V9h3v10"/></svg>
      <div class="ct">合計は+10.9%</div>
      <div class="cd">上半期8,977億円・2年連続の最高</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".35"/><path d="M8 8h8v8" fill="none"/></svg>
      <div class="ct">単価×数量に割る</div>
      <div class="cd">米：量▲13.7%なのに金額+11.6%＝単価約3割高</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 21c-4 0-7-3-7-7 0-5 4-9 7-11 3 2 7 6 7 11 0 4-3 7-7 7Z"/><path d="M12 21V9"/></svg>
      <div class="ct">見えてくる中身</div>
      <div class="cd">けん引は緑茶+83.5%とブリ+69.0%。場所選びの勝ち</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：農林水産省（2026年8月4日）・時事通信ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="170" height="150" viewBox="0 0 170 150" role="img" aria-label="米の輸出は数量が13.7%減ったのに金額が11.6%増えたことを示す2本の棒">
        <rect class="b1" x="25" y="75" width="40" height="50" rx="3"/>
        <rect class="b2" x="100" y="45" width="40" height="80" rx="3"/>
        <text class="tlab" x="45" y="140" text-anchor="middle">数量 ▲13.7%</text>
        <text class="tlab" x="120" y="140" text-anchor="middle">金額 +11.6%</text>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">約3<small>割高</small></div>
      <div class="fl">米の輸出は<strong>量が減って、金額が増えた</strong>。単価に直すとおよそ3割高の計算（1.116÷0.863≒1.29）。「たくさん売れた」ではなく「高く売れる市場に高い米が出ている」と読める。</div>
      <div class="fs">農林水産省 上半期輸出実績（2026年8月4日）・報道数値からの計算</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>金額の伸びは、割ってから驚く</span></div>
</figure>
