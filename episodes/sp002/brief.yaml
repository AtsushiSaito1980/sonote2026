notes: |
  ・**並べる順番が本体**：値札が「付く」（排出枠）→「付け替わる」（人月）→「消える」（手数料ゼロ）。
    3本目で「使う人からは取らない」に着地する
  ・**人間の裏取りが必要**：
    - コムチュアは中計が一次資料。ただし**宣言段階で料金の形は未発表**。台本でもその旨を明示済み（言い過ぎない）
    - 排出量取引の基準価格1,700円は産構審の詳細設計とりまとめ。**制度の最終値かどうかを一次で確認**
    - 届出期限9/30・「来年度から義務」の表現を、経産省の一次資料で突合すること
    - ステーブルコインの「運用益が発行者の収入」は仕組みの説明。**JPYSCの実際の収益構造を一次で確認**（米国発行体の例に引きずられないこと）
  ・時期の明示（憲法§4）：6月の話は「ことしの六月」と明示済み。8/14・9/30は日付で言う
  ・数字は4系統：①基準価格（千七百円）②期限（九月三十日）③公表日（八月十四日）④手数料（ゼロ）
  ・固有名詞：コムチュア／SBI の2つのみ。JPYSC・GX-ETSという略称は耳に残らないので台本では使わず、
    「円建てのステーブルコイン」「国の排出量取引の仕組み」と言い換え（記事では正式名称可）
  ・『』2回：『人数かける稼働率』『AI活用かける伴走力』（どちらも中計の物差しの表現）
  ・**政治性ガード**：排出量取引の是非は論評しない。制度は地形として扱い、値札がどこに付くかだけを見る
  ・暗号資産の投機文脈には寄せない（棚のnoteどおり）
  ・**制作情報を一切出さない**：この回がどう組まれたかには触れない（憲法§2-13）
