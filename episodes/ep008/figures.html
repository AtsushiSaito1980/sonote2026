<!-- ep008 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">返ってくる物を拾い、いちばん傷む単位に分けて持つと、二周目の原価が下がる。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M7 8 4.5 12 7 16"/><path d="M4.5 12H13a4 4 0 0 0 0-8h-1"/><path d="M17 16l2.5-4L17 8"/><path d="M19.5 12H11a4 4 0 0 0 0 8h1"/></svg>
      <div class="ct">返ってきた物を拾う</div>
      <div class="cd">誰かの部屋で使われた家具が戻る</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      <div class="ct">傷む単位に分ける</div>
      <div class="cd">天板と脚を、別々に管理する</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M21 17v-6h-6"/></svg>
      <div class="ct">二周目の原価が下がる</div>
      <div class="cd">八年目に、営業利益が黒字化</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：株式会社クラス 各リリースほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="180" height="150" viewBox="0 0 180 150" role="img" aria-label="ソファの耐用年数が2年から10年に延びたことを示す棒グラフ">
        <text class="vlab" x="0" y="34">通常</text>
        <rect class="b1" x="42" y="20" width="26" height="20" rx="4"/>
        <text class="vlab" x="76" y="35">2年</text>
        <text class="vlab" x="0" y="94">再生前提</text>
        <rect class="b2" x="42" y="80" width="130" height="20" rx="4"/>
        <text class="vlab" x="42" y="125">10年</text>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">5<small>倍</small></div>
      <div class="fl">部品を減らし、ネジを共通にし、分解できるようにしただけで、<strong>ソファの耐用年数が2年から10年へ</strong>。素材ではなく、設計の判断で伸びた。</div>
      <div class="fs">2023年6月時点の同社公表。単独出典のため原典での再確認を推奨</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>設計段階の判断が、数年後の労務費として返ってくる</span></div>
</figure>
