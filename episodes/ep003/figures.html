<!-- ep003 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">営業時間という在庫を、客が引っ越した時間帯へずらした。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <div class="ct">営業時間は、在庫に似ている</div>
      <div class="cd">棚の商品と同じで、置き場所を変えられる</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 8h13l-3-3M21 16H8l3 3"/></svg>
      <div class="ct">客が移った時間へずらす</div>
      <div class="cd">朝6時と、夜24時</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M4 9h16v11H4zM3 9l2-5h14l2 5"/><path d="M9 20v-6h6v6"/></svg>
      <div class="ct">競合のいない時間帯</div>
      <div class="cd">設備投資ゼロ、値引きもゼロ</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：ナップス プレスリリース（2026年7月14日）ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="160" viewBox="0 0 150 160" role="img" aria-label="外出行動が31℃前後から変わり始めることを示す温度計">
        <rect class="tube" x="30" y="10" width="18" height="112" rx="9"/>
        <rect class="merc" x="30" y="62" width="18" height="62"/>
        <circle class="merc" cx="39" cy="130" r="16"/>
        <line class="tick" x1="52" y1="62" x2="66" y2="62"/>
        <text class="tlab" x="70" y="66">31℃</text>
        <line class="tick" x1="52" y1="41" x2="62" y2="41" opacity=".5"/>
        <text class="tlab" x="66" y="45" opacity=".55">35℃</text>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">31<small>℃</small></div>
      <div class="fl">人が街から消え始めるのは、猛暑日の35℃ではなかった。<strong>その4℃も手前、31℃前後から</strong>外出行動は変わり始めている。</div>
      <div class="fs">電通×unerry「猛暑時の外出行動」調査（2026年7月報道）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>需要は消えたのではなく、時間帯を移動していた</span></div>
</figure>
