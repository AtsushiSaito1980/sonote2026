<!-- ep002 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<div class="cover-wrap">
<figure class="fig cover" data-fig="cover">
  <div>
    <div class="fig-kicker">その手があったか</div>
    <div class="cv-lesson">施行日は、開店日。</div>
    <div class="cv-title">カスハラ対策義務化の2ヶ月前に、もう開いていた四つの売り場</div>
  </div>
  <div>
    <div class="cv-stat"><span class="cv-n">27.9<small>%</small></span><span class="cv-cap">すでに相談を受けている企業（前回比+8.4pt）</span></div>
    <div class="fig-foot"><b>その手があったか</b><span>なんで、それで儲かるんですか？</span></div>
  </div>
</figure>
</div>

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">施行日という締切を、すでに棚にある商品に配った。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="16" cy="15.5" r="2" fill="currentColor" stroke="none"/></svg>
      <div class="ct">施行日という締切</div>
      <div class="cd">2026年10月1日。規模の下限はない</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><rect x="3" y="11" width="18" height="5" rx="1"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>
      <div class="ct">すでに棚にある商品</div>
      <div class="cd">研修・録音・カメラ・保険・BPO</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
      <div class="ct">買う理由と、買う期日</div>
      <div class="cd">発明はほぼゼロ。再ラベルと束ね直し</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：厚生労働省 告示・通達ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="27.9%の企業がカスハラの相談を受けたことを示すドーナツ図">
        <circle class="track" cx="75" cy="75" r="60"/>
        <circle class="arc" cx="75" cy="75" r="60" stroke-dasharray="105 377"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">27.9<small>%</small></div>
      <div class="fl">過去3年間にカスハラの相談を受けた企業は<strong>27.9%</strong>。前回調査から<strong>8.4ポイント</strong>増えた。3社に1社近くが、すでに現場で起きている。</div>
      <div class="fs">厚生労働省 令和5年度 職場のハラスメント実態調査</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>対象は、労働者を1人でも雇うすべての事業主</span></div>
</figure>
