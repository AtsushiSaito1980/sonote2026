# ep024 事実カード（extract-facts）
# 生成：2026-08-15／原本：sources/collected.md（S番号対応）
# 方針：一次リリース2本（シリーズA・2024年8社提携）＋日経のリリース転載。シェアは会社公表と明示

episode_id: ep024
extracted_on: 2026-08-15

facts:
  - id: F01
    text: "2026年8月14日、三菱HCキャピタルとShizen Connectが資本業務提携。三菱HCはシリーズAラウンドへの第三者割当増資に参画し、目的は「IoT・AIを活用し、電力需給の最適化によるエネルギー設備の価値向上」"
    confirmed_by: [S1a]
    verify: verified
    note: アンカー。『エネルギー設備の価値向上』が『』候補

  - id: F02
    text: "三菱HCキャピタル側は、グループ会社が保有する低圧太陽光発電所の売電をFIP（市場連動型）へ転換し蓄電池を併設、Shizen ConnectのVPPで最適制御・運用検証を進める。リース会社の発電所が「制御つきの資産」に変わる"
    confirmed_by: [S1a]
    verify: verified
    note: 台本ではFIPを「固定価格の売電から、市場連動の売り方へ」と言い換え

  - id: F03
    text: "VPP（仮想発電所）＝家庭や企業の蓄電池・EV・給湯器などを遠隔で統合制御し、一つの発電所のように機能させる仕組み。電気が余るときに貯め（沸かし）、足りないときに放すことで、再エネの出力制御の抑制と需給バランス調整を行う"
    confirmed_by: [S2a, S3a]
    verify: verified
    note: Q1の土台。「出力制御」の語は一次リリースにあり

  - id: F04
    text: "Shizen Connectは2026年5月25日、シリーズA 1stクローズで約27億円を調達（グループ外累計32.6億円）。出資はBIPROGY・東京ガス・パナソニック エレクトリックワークス・九州電力・東邦ガス・西日本鉄道の6社で、株主は電力5社（北海道・北陸・四国・九州・JERA）・ガス3社（東京・大阪・東邦）などを含む計16社に"
    confirmed_by: [S2a]
    verify: verified
    note: 台本では社名を束ねて「北海道から九州まで、電力五社にガス三社」

  - id: F05
    text: "会社公表では、系統用蓄電池領域と家庭用DR（需要側の制御）領域でそれぞれ市場シェア1位。家庭用蓄電池は市場シェア合計80%のメーカーに、エコキュート（ヒートポンプ給湯器）は同97%のメーカーに制御対応する"
    confirmed_by: [S2a]
    verify: partial   # 会社公表値。第三者調査の有無は人間確認
    note: **「会社の発表では」の枠づけ必須。**「どの家のどの機器でもつながる」の根拠

  - id: F06
    text: "国の見通しでは2030年までに蓄電池の導入は計50GWhにのぼる（シリーズAリリース内の記載）。2024年7月時点の対応メーカーシェアは約57%で、2026年5月には80%へ拡大していた"
    confirmed_by: [S2a, S3a]
    verify: verified  # いずれも一次リリース内の記載
    note: 50GWhの原出典（国の資料名）は人間裏取り。台本では「国の見通しでは」と枠づけ

  - id: F07
    text: "Shizen Connectは自然電力がVPPアグリゲーター事業を分社化して2023年に設立。2024年7月に電力・ガス大手など8社と資本業務提携（当時累計13.6億円）し、2030年までに売上高100億円を目標に掲げる"
    confirmed_by: [S3a, S3b]
    verify: verified
    note: 分社の正確な月は未確認→「二〇二三年」の年のみ使用

