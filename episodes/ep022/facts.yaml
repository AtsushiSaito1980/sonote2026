episode_id: ep022
extracted_on: 2026-08-15

facts:
  - id: F01
    text: "2026年8月5日、東京地裁がオッドナンバー・イグニス・パルスの3社に破産手続き開始を決定。負債は合計約297億3,865万円。8月13日に帝国データバンクが速報し各社が報道"
    confirmed_by: [S1a, S1c]
    verify: verified
    note: アンカー。台本は「八月五日」「八月十三日」と月を明示（放送9/3想定）

  - id: F02
    text: "負債の内訳：VRコンテンツ開発のパルス約139億8,606万円（最大）・ゲーム運営のオッドナンバー約107億2,767万円・グループ持ち株会社のイグニス約50億2,492万円。3社とも渋谷区神宮前の同住所"
    confirmed_by: [S1a]
    verify: verified
    note: gamebizの103億は2024年12月期時点の数字→不使用（rejected）

  - id: F03
    text: "イグニスは2010年5月設立。カジュアルアプリからマッチングアプリ「with」で成長し東証マザーズに上場。2021年3月、米投資ファンドのベインキャピタルと経営陣によるMBOを発表（買付総額約500億円・1株3,000円）し、同年6月に非公開化。「戦略事業に積極投資」を掲げた"
    confirmed_by: [S2a, S2b]
    verify: verified   # 当時の日経・gamebiz報道2系統
    note: 入口の言葉『戦略事業に積極投資』は『』候補。ベインは台本で「アメリカの投資ファンド」と言い換え

  - id: F04
    text: "2022年3月、マッチングアプリ「with」がベイン主導でイグニスからスピンアウト（分離後の株主はベイン約49%・創業者約39%ほか）。withはその後Omiaiと統合されエニトグループとして存続・成長側へ。破産した3社とは別の道を歩んだ"
    confirmed_by: [S3a]
    verify: verified
    note: 因果の断定はしない。「稼ぎ頭が枠組みの中で別会社になった」という事実の並びだけを置く

  - id: F05
    text: "パルス（2016年11月設立）はバーチャルライブの世界「INSPIX WORLD」を運営。2021年5月の『ヒプノシスマイク』VRライブ第2回はチケット販売50万9,248枚・売上約5億円（1枚1,000円計算）を記録。当時、複数コンテンツで「制作費を全額負担」しながら市場開拓と説明していた"
    confirmed_by: [S4a]
    verify: dated      # 2021年9月の取材記事→「五年前」「二〇二一年五月」と時期明示必須
    note: 絶頂期の記録としてのみ使う。破産との因果は語られていない

  - id: F06
    text: "オッドナンバーは2022年3月設立。「ラブライブ!」シリーズのスマホゲーム「Link! Like! ラブライブ!」を2023年から、別の人気音楽プロジェクトのアプリを2024年から開発・運営。同年、テレビ局の番組と組んだ電子スポーツも開始"
    confirmed_by: [S1a]
    verify: verified
    note: IPは他社の権利＝「看板を借りる側」を必ず明示（作品の存廃とは別の話）

  - id: F07
    text: "停止の連鎖：2025年9月に音楽プロジェクトのアプリ終了（開始から約1年）→2026年4月に「Link! Like!」終了発表→5月にINSPIX WORLD運営を他社に移管・電子スポーツ停止・高額賞金を公表していた大会も中止→6月30日「Link! Like!」終了→8月5日破産開始。TDBは「主要事業が相次ぎ終了する中で資金繰りが限界」と記載"
    confirmed_by: [S1a, S1b]
    verify: verified
    note: 死因の時系列。オッドナンバー設立（2022年3月）から破産まで4年余

  - id: F08
    text: "2026年4月、会社は「サービスを継続できる健全な経営が不可能な状況に陥った」と発表していた（報道引用）"
    confirmed_by: [S1c]
    verify: verified
    note: 出口の言葉。『』候補

