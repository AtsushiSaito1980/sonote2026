  ・固有名詞1系統：EU（イーユー）のみ。**規則名・条番号・企業名は台本で言わない**
  ・『』1回：義務の趣旨（「使う人が、容易に、安全に、無償で、データにアクセスできること」）
  ・**T5の答え4つは「番組の見立て」**（出典が明示しているのは修理・アフターサービス・競合への共有まで）→reviewに明記し、
    台本でも「たとえば」「考えられます」の枠で提示する
  ・政治性ガード：EUの規制の是非・米欧比較・データ主権の議論に触れない。地形として扱う
  ・**「日本にも来る」と断定しない**。解剖の三点目を聞き手への問いに変換
  ・咀嚼の3拍：①機械のデータは作った会社のものだと思っていた→使う人のものになる
    ②メーカーが損をするだけの話かと思った→開く側に回れば、他社の機械のデータも扱える
    ③データを渡すと商売が細ると思った→囲いが外れるなら、囲いの外で売れるものを先に作る
  ・時期の言い回し：放送9/29想定。**放送日が適用日（9/12）の後**になるため「九月十二日から」と過去形にしない設計
    →「九月十二日、〜が変わります／変わりました」ではなく「九月十二日に切り替わる決まりです」の中立表現を使う
