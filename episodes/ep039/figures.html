  <div class="combo">
    <div class="cbox">

      <div class="cd">センサーを積み、動作し、データを出すもの。産業機械・車両・農業機械・家電</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 3v18" opacity=".4"/><path d="M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>

      <div class="cd">2025年9月12日から。渡す先は修理・アフターサービス・競合を含む</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
