facts:
  - id: F01
    text: "EUのデータ法（Data Act）により、2026年9月12日以降にEU市場へ出される「つながる製品」と関連サービスは、利用者がそのデータへ既定でアクセスできる設計にすることが求められる"
    confirmed_by: [S1]
    verify: verified   # 法律事務所の実務解説の複数系統一致（規則原文の確認は人間裏取り）
    note: アンカー（確定日付）

  - id: F02
    text: "求められる状態は、利用者が容易に・安全に・無償で・構造化された機械可読の形式でアクセスできること。関連しかつ技術的に可能な場合には、直接かつリアルタイムでのアクセスも求められる。ただし『データ保有者を介さない直接アクセス』の設計義務は絶対ではなく、技術的に可能な範囲に限られる"
    confirmed_by: [S1]
    verify: verified
    note: 『』候補。**「絶対ではない」条件も必ず添える**

  - id: F03
    text: "前段として2025年9月12日から、EU内のつながる製品の利用者（企業・消費者）は、データ保有者がアクセスできるデータの開示を求めることができ、第三者への共有を要求することもできるようになっている"
    confirmed_by: [S1]
    verify: verified
    note: 二段構えの制度設計

  - id: F04
    text: "利用者はいつでもアクセスを要求でき、誰に渡すかを自分で決められる。渡す先には修理業者、アフターサービスの事業者、さらには競合他社も含まれる。事業者側がそのデータをどう使うかに制限をかけることもできる"
    confirmed_by: [S1]
    verify: verified
    note: **この回の芯。**「持ち主が移る」

  - id: F05
    text: "対象は、センサーを積んで動くもの全般——産業機械、車両、家電、IoT機器、農業機械などが実務解説の共通例として挙げられる"
    confirmed_by: [S2]
    verify: partial   # 解説群の共通例。定義の細部は規則原文で確認
    note: 台本では「工場の機械から、家の家電まで」の水準

