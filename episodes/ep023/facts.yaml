facts:
  - id: F01
    text: "2026年10月1日、ビール・発泡酒・新ジャンルの酒税が350ml換算54.25円（1kl 155,000円）に完全統一される。ビールは63.35円から9.1円の減税、発泡酒・新ジャンルは46.99円から7.26円の増税"
    confirmed_by: [S2]
    verify: verified   # 複数解説系統で数字一致（財務省資料での最終突合は人間へ）
    note: 数字COの核。「五十四円二十五銭」

  - id: F02
    text: "この統一は2017年度税制改正で決まり、2020年10月・2023年10月・2026年10月の3段階で実施されてきた。最終段階の日付は9年前から公表されていた"
    confirmed_by: [S2]
    verify: verified
    note: 「隙間が閉じる日は公開情報だった」の根拠

  - id: F03
    text: "1994年10月、サントリー「ホップス」発売が発泡酒市場の起点。麦芽比率65%で、麦芽67%未満なら税率がビールより低い区分に入った。350ml缶180円と、当時のビールより安く売られた"
    confirmed_by: [S3a]
    verify: verified   # キリン社史コラム（当事者の記録）
    note: 台本では価格を「ビールより数十円安い」水準に丸める

  - id: F04
    text: "増税のたびに再設計が繰り返された：1996年の増税で各社は麦芽25%未満の低税率クラスへ。2003年の発泡酒増税を受け、2004年にサッポロ「ドラフトワン」＝麦芽を使わずえんどう豆由来のたんぱくで作る「新ジャンル」第1号が発売された"
    confirmed_by: [S3b]
    verify: verified   # 複数系統（J-CAST・解説系・Wikipedia一致）
    note: OP03の順回転（素材を替えて税区分を下る）32年の芯

  - id: F05
    text: "キリンは2026年5月27日の発表で「本麒麟」を新ジャンルからビールへ変更すると発表。麦芽比率を引き上げ麦100%の生ビールにし、アルコール度数は6%から5%へ。2026年11月4日に全国発売"
    confirmed_by: [S4a]
    verify: verified   # 食品新聞・ITmedia・日経の3系統
    note: OP03の逆回転（素材を戻して税区分を上る）。発表日5/27は窓外→「ことし五月の発表」と時期明示

  - id: F06
    text: "日経報道によると、ビール化後の本麒麟の価格は「第三のビール（新ジャンル）並み」とされる。税率統一後は、新ジャンル価格帯のビールが成立する"
    confirmed_by: [S4b]
    verify: verified
    note: 『』候補（趣旨再現）。「安いビール」という新地形の根拠

  - id: F07
    text: "サントリー「金麦」も新ジャンルからビールへの変更を発表済みとされ、大手各社で看板の新ジャンル商品をビール化する動きが続く。「一番搾り」は2026年8月製造品から刷新版に切り替え"
    confirmed_by: [S4c, S4a]
    verify: partial    # 金麦は@DIME経由→一次裏取りへ。一番搾りは3系統
    note: 台本では金麦・一番搾りの名は出さず「他社の看板商品も続々」の水準（記事では実名可）

  - id: F08
    text: "業界紙の記事（2026年7月29日）によると、マーケティング会社の調査でビール類飲用者の8割が改正を認知する一方、内容まで把握しているのは3割。発泡酒・新ジャンル飲用者の約半数が、改正後の飲用ジャンル変更を検討している"
    confirmed_by: [S1a]
    verify: partial    # 見出し・要旨ベース（本文未フェッチ）→調査主体・時期・n数は人間裏取り
    note: 窓内アンカー。台本は「七月末の業界紙の記事によると」＋伝聞で処理

