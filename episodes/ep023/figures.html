<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">麦芽比率という設計変数で税区分を降りてきた32年。隙間が閉じる日が来て、同じ変数を逆向きに回す。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M6 3h12l-2 7a4 4 0 0 1-8 0L6 3Z"/><path d="M12 14v5m-3 2h6"/></svg>
      <div class="ct">税率の隙間で32年</div>
      <div class="cd">1994ホップス（麦芽65%）→25%未満→2004ドラフトワン（えんどう豆）</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4m8-4v4"/><path d="M9 14l2 2 4-4"/></svg>
      <div class="ct">閉じる日は公開情報</div>
      <div class="cd">2017年に3段階統一が決定。最終段が2026年10月1日</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>
      <div class="ct">土俵ごと引っ越す</div>
      <div class="cd">本麒麟は麦100%のビール化（11/4発売）。価格は「第三」並みに</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：キリン発表（2026/5/27）・日経・キリン歴史ミュージアムほか</span></div>
</figure>
