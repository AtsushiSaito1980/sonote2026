<!-- ep004 note用の書き出し図版。.fig ひとつ＝画像1枚。data-fig がファイル名になる -->

<figure class="fig" data-fig="combo">
  <div class="fig-kicker">この回の見立て</div>
  <p class="fig-lead">花火はそのままに、請求書の宛名を観客から企業へ入れ替えた。</p>
  <div class="combo">
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/><circle cx="12" cy="12" r="2.5"/></svg>
      <div class="ct">囲い込めない商品</div>
      <div class="cd">空に上がるので、払っていない人にも見える</div>
    </div>
    <div class="cop">×</div>
    <div class="cbox">
      <svg class="cico" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      <div class="ct">請求書の宛名を替える</div>
      <div class="cd">観客 → 協賛企業 → 全国区の企業</div>
    </div>
    <div class="cop">＝</div>
    <div class="cbox out">
      <svg class="cico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1.5"/></svg>
      <div class="ct">新しい財源が立つ</div>
      <div class="cd">無料の逃げ場は、残したまま</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>出典：Business Insider Japan（2026年8月）ほか</span></div>
</figure>

<figure class="fig" data-fig="number">
  <div class="fig-kicker">そうだったのか、という数字</div>
  <div class="figstat">
    <div class="figviz">
      <svg class="viz" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="花火大会の総予算の3分の1が警備費であることを示す円グラフ">
        <circle class="rest" cx="75" cy="75" r="60"/>
        <path class="wedge" d="M75 75 L75 15 A60 60 0 0 1 126.96 105 Z"/>
      </svg>
    </div>
    <div class="figtxt">
      <div class="fn">1<small>/3</small></div>
      <div class="fl">花火大会の総予算の<strong>3分の1は、警備費</strong>。前年比25%増で、当日は約1,600人が警備にあたる。火薬ではなく、人をさばく費用が大会を止めている。</div>
      <div class="fs">鎌倉花火大会 主催者談（2026年7月報道）</div>
    </div>
  </div>
  <div class="fig-foot"><b>その手があったか</b><span>2025年7月時点で、全国28会場の中止が確定していた</span></div>
</figure>
