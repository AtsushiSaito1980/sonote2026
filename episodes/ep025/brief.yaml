notes: |
  ・採点（selection.yaml ep025）：Q1○（登録代行・代理人・包装素材で儲け手が立つ）Q2✗・
    C1◎（EUの環境規則×通販の出品審査＝別世界の2つ）・C2○（27か国・1,000ユーロ/国・20万ユーロ＋即時販売禁止）・
    C3○（「誰が確認するか」を見る一般形）・C4○（OP03主役）・C5○（止まる出品画面と27の登録窓口）・面白さ85
  ・**海外回の5ルール（CLAUDE.md §9）を全部当てる：**
    1. 規則そのものは EUR-Lex（Regulation (EU) 2025/40・OJ L 2025/40, 22.1.2025）で確定済み。日本語解説は「日本企業への影響」にだけ使う
    2. 通貨はユーロのまま。**記号（€）は書かない**（check.py の通貨記号ゲート）。円換算しない
    3. 固有名詞は絞る：EU／アマゾン の2系統。PPWRは「包装と包装廃棄物の規則」、
       LUCID・CITEO等は「国ごとの登録先」、PFASは「有機フッ素化合物」と言い換え。ドイツは地名で対象外
    4. **制度は地形として扱う。**EUの規制の是非・他地域との比較は一切しない
    5. **解剖の三点のうち三点目を日本への置き換えにする。**「EUに売っている日本の会社は四日前から止まる」は事実（ジェトロ等）。
       「日本の売り場でも同じ形が来る」は断定せず、聞き手への問いに変換する
  ・数字は4系統設計（balanced上限5・余裕1）：
    ①日付（八月十二日・二〇二八年・二〇三〇年）
    ②国の数（二十七）
    ③代行の値段（一か国あたり年に千ユーロ／代理人は二千から四千ユーロ）
    ④罰則（二十万ユーロ・ドイツの例1件のみ）
  ・PFASの閾値・2040年目標・国別の罰則一覧は**不使用**（rejected 参照）
  ・『』1回：義務の趣旨『出品を有効にする前に、登録されているかを確かめること』（趣旨再現・伝聞の枠で）
  ・咀嚼の3拍：①一つの市場だから登録も一回だと思った→二十七回 ②役所が取り締まると思った→止めるのは売り場
    ③規制はコストだと思った→代行を売る商売が立ち上がっていた
  ・時期の言い回し：放送9/8想定。「八月十二日」と日付で言う（「先週」「今月」は使わない）
