# ep025 事実カード（extract-facts）
# 生成：2026-08-16／原本：sources/collected.md（S番号対応）
# **海外回。**規則の中身は EUR-Lex 一次と、販売者向け解説の複数系統一致で確定。金額はユーロのまま扱う

episode_id: ep025
extracted_on: 2026-08-16
region: 海外

facts:
  - id: F01
    text: "EUの包装・包装廃棄物規則（Regulation (EU) 2025/40）が2026年8月12日、猶予期間なしで適用開始。登録・報告・包装の基準が同時に効力を持つ"
    confirmed_by: [S1a, S2a, S2b]
    verify: verified   # 規則番号と官報掲載日はEUR-Lex一次、適用日は解説複数系統が一致
    note: アンカー。制作日の4日前。台本では「八月十二日」と日付で言う

  - id: F02
    text: "規則の正式名称は「2024年12月19日付 欧州議会および理事会の規則 (EU) 2025/40（包装および包装廃棄物に関する規則）」。官報掲載は2025年1月22日"
    confirmed_by: [S1a]
    verify: verified   # EUR-Lex（一次）
    note: 台本では名称を読み上げない（§2-8 出典読み上げの禁止）。記事の出典欄で使う

  - id: F03
    text: "登録はEU全体で共通ではなく、加盟国ごと。売る国それぞれで包装の登録が必要で、国ごとに登録簿・ポータル・手続きが別々にある。EUは27加盟国"
    confirmed_by: [S2a, S2b]
    verify: verified
    note: **この回の芯。**「一つの市場のはずなのに、登録は国の数だけ要る」

  - id: F04
    text: "オンラインの売り場は、出品者の登録を販売前に検証する義務を負う（デジタルサービス法 2022/2065 と接続する条項）。登録が無い出品は停止される。罰金を待つより先に、売る手段が消える"
    confirmed_by: [S2a, S2b]
    verify: verified   # 解説複数系統が一致（条番号 Article 45(4) は人間裏取りへ）
    note: OP03の核。台本では条番号を言わない

  - id: F05
    text: "EU域外の通信販売業者も対象で、売る国ごとに現地の代理人（Authorised Representative）を置く必要がある。日本からEUへ売る事業者も含まれる"
    confirmed_by: [S2b, S4b]
    verify: verified
    note: 日本への置き換えの土台

  - id: F06
    text: "この確認と登録を代行する商売が立ち上がっている。ある事業者は登録・報告・代理・売り場の監視をまとめて1か国あたり年1,000ユーロで提供。代理店による代理人の相場は1か国あたり2,000〜4,000ユーロとされる"
    confirmed_by: [S3]
    verify: partial    # サービス事業者の提示価格。公定価格ではない
    note: Q1（儲け手）の実在。台本では「ある会社の値段」と1系統だけ示す

  - id: F07
    text: "罰則は加盟国の国内法による。ドイツでは20万ユーロの制裁金に加え、即時の販売禁止が科されうる"
    confirmed_by: [S2a]
    verify: partial    # 解説記事ベース。国内法の条文は未確認
    note: 国別一覧は使わず、ドイツの例1件だけ

  - id: F08
    text: "この先の日付も決まっている。2028年8月から包装にQRコードと統一の分別記号が必要になり、2030年からはリサイクルしやすさが基準に満たない包装はEU市場で売れなくなる"
    confirmed_by: [S2a, S1a]
    verify: verified   # 2030年の基準適用は EUR-Lex recital 28 でも確認
    note: 「閉じる日も、開く日も、先に決まっている」の材料

  - id: F09
    text: "日本企業への影響：EUへ輸出する、EUで製造販売する、EU向けに包装を設計・供給する事業者は直接の対象になり得る。直接の義務が無くても、対応を進める取引先から要請という形で間接的に及ぶ"
    confirmed_by: [S4a, S4b]
    verify: verified   # ジェトロ＋大手会計事務所系の解説が一致
    note: **解剖の三点目（日本への置き換え）の根拠。**海外回の必須ルール5

