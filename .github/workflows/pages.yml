name: Deploy archive site to GitHub Pages

# episodes/ から docs/ を作り直して GitHub Pages へ公開する。
# main への push で自動実行。Actions タブの "Run workflow" から手動実行もできる。
#
# 【最初に一度だけ必要な設定】
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
#   これはワークフローからは実行できない（GITHUB_TOKEN では Pages サイトを新規作成
#   できず "Resource not accessible by integration" になる）。設定後に Actions タブ
#   からこのワークフローを再実行すれば公開される。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: サイトを再生成（episodes/ が唯一の情報源）
        run: python3 scripts/build_site.py

      - name: 公開用に整える（内部仕様書 plan.md は公開しない）
        run: |
          rm -rf _site
          cp -r docs _site
          rm -f _site/plan.md
          echo "--- 公開されるファイル ---"
          find _site -type f | sort

      # Settings → Pages の Source が「GitHub Actions」になっていないとここで失敗する
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 実行結果の画面に公開URLを大きく出す（毎回ログを掘らなくて済むように）
      - name: 公開URLを実行サマリに書く
        run: |
          {
            echo "## サイトを公開しました"
            echo
            echo "**${{ steps.deployment.outputs.page_url }}**"
          } >> "$GITHUB_STEP_SUMMARY"
