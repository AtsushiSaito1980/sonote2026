name: Deploy archive site to GitHub Pages

# episodes/ から docs/ を作り直して GitHub Pages へ公開する。
# main への push で自動実行。Actions タブの "Run workflow" から手動実行もできる。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: サイトを再生成（episodes/ が唯一の情報源）
        run: python3 scripts/build_site.py

      - name: 公開用に整える（内部仕様書 plan.md は公開しない）
        run: |
          rm -rf _site
          cp -r docs _site
          rm -f _site/plan.md
          echo "--- 公開されるファイル ---"
          find _site -type f | sort

      # Pages が未設定なら、この step が有効化する（enablement: true）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
