name: Deploy archive site to GitHub Pages

# episodes/ から docs/ を作り直して GitHub Pages へ公開する。
# main への push で自動実行。Actions タブの "Run workflow" から手動実行もできる。
#
# 【最初に一度だけ必要な設定】この2つはワークフローからは自動化できない
#   1. Settings → Pages → Source を「GitHub Actions」にする
#      （GITHUB_TOKEN に Pages サイトを新規作成する権限がないため。
#        configure-pages の enablement: true は public/private いずれでも
#        "Resource not accessible by integration" で失敗する）
#   2. Settings → Actions → General → Workflow permissions を
#      「Read and write permissions」にする
#      （読み取り専用だと下の permissions: の要求が上限に阻まれ、
#        deploy ジョブがステップを1つも実行せず即失敗する）
#
# 【それでも deploy が即失敗するとき】
#   Settings → Environments → github-pages → Deployment branches に
#   main が含まれているか確認する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: サイトを再生成（episodes/ が唯一の情報源）
        run: python3 scripts/build_site.py

      - name: 公開用に整える（内部仕様書 plan.md は公開しない）
        run: |
          rm -rf _site
          cp -r docs _site
          rm -f _site/plan.md
          echo "--- 公開されるファイル ---"
          find _site -type f | sort

      # Source が「GitHub Actions」になっていないと Not Found でここが失敗する
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # environment: github-pages を宣言すると、この環境のデプロイ許可設定で弾かれた場合に
  # ジョブがステップを1つも実行せず即失敗し、ログも残らない（run #5〜#7 で観測）。
  # 宣言を外すとジョブは起動するので、失敗しても deploy-pages のエラーが読める。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 実行結果の画面に公開URLを大きく出す（毎回ログを掘らなくて済むように）
      - name: 公開URLを実行サマリに書く
        run: |
          {
            echo "## サイトを公開しました"
            echo
            echo "**${{ steps.deployment.outputs.page_url }}**"
          } >> "$GITHUB_STEP_SUMMARY"
