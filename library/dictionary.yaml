# TTS読み辞書（テスト駆動で育成）
# 運用：生成音声で誤読した語だけを追記する。先回りで全部開かない。
# 部分開き（空飛ぶ→そら飛ぶ）か、言い換えて難読語ごと消すのを優先。カタカナよりひらがな。

英字・略語:
  BtoB: ビーツービー
  PoC: ピーオーシー
  PIT: ピット
  unerry: ウネリー
  USEN: ユウセン
  SOLAFIL: ソラフィル
  JPX ONE: ジェイピーエックスワン
  VSING: ブイシング
  AI: エーアイ
  BGM: ビージーエム
  CD: シーディー
  CMP: シーエムピー
  HC: エイチシー
  JFE: ジェイエフイー
  VR: ブイアール
  ZOZO: ゾゾ
  with: ウィズ
  シリーズA: シリーズエー
  SBI: エスビーアイ

誤読が出たら追記:
  施行: しこう      # 「せこう」誤読の定番
  五季: ごき
  酷暑日: こくしょび
  和光: わこう
  異彩: いさい
  晴れ風: はれかぜ
  耐荷重: たいかじゅう
  初速: しょそく

開かない語（駄洒落・語感が死ぬ）:
  - 家系図
